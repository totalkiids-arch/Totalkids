          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminImage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      operationId: adminDeleteProductImage
      summary: Borrar una imagen (y su archivo)
      description: 409 si es la última imagen de un producto publicado.
      x-roles: [admin]
      tags: [Panel - Catálogo]
      security: [{ panelSession: [], csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      responses:
        "204": { description: Imagen borrada }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/products/{id}/stock-adjustments:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      operationId: adminAdjustStock
      summary: Ajuste de inventario de una variante
      description: |
        Fija el nuevo stock físico con un motivo obligatorio (RF-34). Bloquea la
        fila de la variante (SELECT … FOR UPDATE): un ajuste y una reserva
        simultáneos se aplican uno tras otro. No puede dejar el físico por debajo
        de lo reservado (RN-03) ni repetir el valor actual (422). Stock 0 = se vende
        a pedido. Crea un `InventoryMovement` (`adjustment`) y una fila de audit_log.
      x-roles: [admin]
      tags: [Panel - Catálogo]
      security: [{ panelSession: [], csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockAdjustmentInput" }
            example:
              {
                variantId: 0195f3a0-7c1e-7d2a-9b44-2f1c3a5d6e70,
                stockPhysical: 8,
                reason: Conteo de bodega,
              }
      responses:
        "201":
          description: Ajuste registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockAdjustmentResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/products/{id}/stock-movements:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: adminListStockMovements
      summary: Historial de movimientos de inventario del producto o de una variante
      description: Todos los tipos (ajustes, reservas, ventas…), más recientes primero.
      x-roles: [admin]
      tags: [Panel - Catálogo]
      security: [{ panelSession: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - { name: variantId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Página de movimientos
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/InventoryMovement" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/inventory:
    get:
      operationId: adminListInventory
      summary: Inventario de todo el catálogo (una fila por variante)
      description: |
        Para la pantalla Inventario del panel (RF-34, RN-03): todas las variantes,
        activas e inactivas, de productos en cualquier estado, con stock físico,
        reservado y disponible. Orden por nombre de producto y orden de la
        variante. `q` busca en el nombre del producto o el SKU (sin distinguir
        mayúsculas). El ajuste se hace con `POST /admin/products/{id}/stock-adjustments`.
      x-roles: [admin]
      tags: [Panel - Catálogo]
      security: [{ panelSession: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: Página de variantes
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/InventoryRow" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/categories:
    get:
      operationId: adminListCategories
      summary: Categorías del panel (activas e inactivas) con su conteo de productos
      x-roles: [admin]
      tags: [Panel - Catálogo]
      security: [{ panelSession: [] }]
      responses:
        "200":
          description: Categorías
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminCategory" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: adminCreateCategory
      summary: Crear categoría
      description: |
        Nombre único sin distinguir mayúsculas, tildes ni espacios de más; el slug
        se deriva del nombre y también debe ser único.
      x-roles: [admin]
      tags: [Panel - Catálogo]
      security: [{ panelSession: [], csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCategoryInput" }
      responses:
        "201":
          description: Categoría creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/categories/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
      - $ref: "#/components/parameters/CsrfTokenHeader"
    patch:
      operationId: adminUpdateCategory
      summary: Editar categoría (el slug no cambia)
      x-roles: [admin]
      tags: [Panel - Catálogo]
      security: [{ panelSession: [], csrfCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCategoryInput" }
      responses:
        "200":
          description: Categoría actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      operationId: adminDeactivateCategory
      summary: Desactivar categoría (avisa si hay productos que la usan)
      description: |
        La categoría pasa a inactiva; los productos no cambian. Responde 200 con el
        conteo de productos que la usan y un aviso: los publicados que la tienen
        como principal dejan de verse en la tienda hasta reasignarlos o reactivarla.
      x-roles: [admin]
      tags: [Panel - Catálogo]
      security: [{ panelSession: [], csrfCookie: [] }]
      responses:
        "200":
          description: Categoría desactivada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCategoryDeactivation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/extras:
    get:
      operationId: adminListExtras
      summary: Extras que se pueden ofrecer en un producto
      x-roles: [admin]
      tags: [Panel - Catálogo]
      security: [{ panelSession: [] }]
      responses:
        "200":
          description: Extras
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminExtra" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ───────────────────────── Panel: pedidos (LN-13) ─────────────────────────
  # Pedidos, estados y factura: Administrador y Operador. Reembolsos: solo
  # Administrador. `{id}` es el uuid del pedido o su número visible ("TK-1048" o
  # "1048"). Los cambios bloquean la fila del pedido (FOR UPDATE) y quedan en
  # audit_log con actor, motivo y requestId. Errores de forma: 422 con un issue
  # por campo y el texto del panel; conflictos con el estado del pedido: 409 con
  # `details.field` (campo del formulario del panel: to, restock, amount, number o form).
  /admin/orders:
    get:
      operationId: adminListOrders
      summary: Pedidos filtrables
      description: |
        Más recientes primero. `q` busca por número ("TK-1048" o "1048"), nombre
        o correo del comprador, sin distinguir tildes ni mayúsculas. `status` y
        `paymentStatus` aceptan varios valores (`?status=a&status=b` o `a,b`);
        el estado de pago es el del último intento (`none` = nunca se intentó).
        `from` y `to` son días de Chile, ambos inclusive. `invoicePending` =
        pedido con factura, pagado y sin folio.
      x-roles: [admin, operator]
      tags: [Panel - Pedidos]
      security: [{ panelSession: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - name: status
          in: query
          style: form
          explode: true
          schema: { type: array, items: { $ref: "#/components/schemas/OrderStatus" } }
        - name: paymentStatus
          in: query
          style: form
          explode: true
          schema: { type: array, items: { $ref: "#/components/schemas/OrderPaymentStatus" } }
        - { name: deliveryMethod, in: query, schema: { type: string, enum: [shipping, pickup] } }
        - { name: invoicePending, in: query, schema: { type: string, enum: ["true", "false"] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Página de pedidos
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminOrderSummary" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/orders/{id}:
    get:
      operationId: adminGetOrder
      summary: Detalle de pedido con pagos, reembolsos, historial, actividad y correos
      description: |
        Incluye las transiciones disponibles ya calculadas (`availableTransitions`),
        si se puede registrar la reposición al cancelar y si un pago sin resolver
        bloquea cancelar o vencer, para que el panel no repita reglas.
      x-roles: [admin, operator]
      tags: [Panel - Pedidos]
      security: [{ panelSession: [] }]
      parameters: [{ $ref: "#/components/parameters/OrderRef" }]
      responses:
        "200":
          description: Pedido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrderDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/orders/{id}/status:
    patch:
      operationId: adminChangeOrderStatus
      summary: Transición de estado autorizada
      description: |
        Tabla de la SRS: pendiente de pago → confirmado, cancelado o vencido; pago
        en revisión → confirmado o cancelado; confirmado → en preparación o
        cancelado; en preparación → despachado o cancelado; despachado →
        entregado. Entregado, cancelado y vencido son terminales. Registra
        historial con actor, fecha y motivo (RF-27) y auditoría `order.status_changed`.

        - Confirmar exige un pago confirmado y ya asentado (reservas y cupón, LN-10).
          Un pedido sin pago confirmado no se despacha (409, `field: to`).
        - RN-04: con el último pago pendiente o en revisión no se cancela ni vence.
        - Despachado a domicilio exige `carrier` y `code` (422). En retiro en taller,
          "Despachado" es "listo para retiro" y no los lleva.
        - Cancelar o vencer libera las reservas (movimiento `release`) y, si no hubo
          pago, el uso del cupón. Cancelar un pedido pagado no devuelve dinero.
        - `restock: true` solo al cancelar un pedido pagado, una vez (RN-06): repone
          lo que la venta descontó (movimiento `restock`, `order.restock_recorded`).
        - Encola `order_shipped` (con la plantilla de retiro en taller si corresponde)
          y `order_delivered`, sin duplicar.
      x-roles: [admin, operator]
      tags: [Panel - Pedidos]
      security: [{ panelSession: [], csrfCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderRef"
        - $ref: "#/components/parameters/CsrfTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderStatusChangeInput" }
      responses:
        "200":
          description: Pedido actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrderDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/orders/{id}/refund-records:
    post:
      operationId: adminRecordRefund
      summary: Registrar reembolso manual
      description: |
        Registra una devolución hecha fuera del sistema (RF-32): nunca modifica el
        pago ni el estado del pedido. Solo pedidos con pago confirmado (409
        `field: form`). El monto es entero en CLP y, sumado a los reembolsos
        solicitados y procesados, no supera lo cobrado (422 en `amount` con lo
        que queda; los fallidos no cuentan). La fecha, en días de Chile, no es
        futura ni anterior al cobro. Registrado como `processed` queda resuelto.
        Auditoría `order.refund_recorded`.
      x-roles: [admin]
      tags: [Panel - Pedidos]
      security: [{ panelSession: [], csrfCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderRef"
        - $ref: "#/components/parameters/CsrfTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundRecordInput" }
      responses:
        "201":
          description: Reembolso registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefundResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/orders/{id}/refund-records/{refundId}:
    patch:
      operationId: adminResolveRefund
      summary: Resolver un reembolso solicitado (procesado o fallido)
      description: |
        Solo sobre uno `requested`, una sola vez (409 «Ese reembolso ya fue
        resuelto.»). Un fallido deja de contar para el tope. 404 «El reembolso ya
        no existe.» si no es de este pedido. Auditoría `order.refund_resolved`.
      x-roles: [admin]
      tags: [Panel - Pedidos]
      security: [{ panelSession: [], csrfCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderRef"
        - { name: refundId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CsrfTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [processed, failed] }
      responses:
        "200":
          description: Reembolso resuelto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefundResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/orders/{id}/invoice:
    post:
      operationId: adminRegisterInvoice
      summary: Registrar o corregir el folio de la factura emitida por Total Kids
      description: |
        Cambio del cliente: Flow solo cubre la boleta (su comprobante la reemplaza).
        Para pedidos con factura y pago confirmado, que quedan como "Factura
        pendiente" hasta registrar el folio. Solo dígitos (hasta 10); se quitan los
        ceros a la izquierda. El folio es único entre pedidos (409 `field: number`).

        - Administrador y Operador registran el primer folio (201,
          `order.invoice_registered`).
        - Ya registrado y sin `replace`: 409 «La factura de este pedido ya está registrada.»
        - Corregir (`replace: true`) es solo del Administrador (Operador → 403), con
          `reason` obligatorio y un folio distinto (200, `order.invoice_replaced`).
        - Con boleta o sin pago confirmado: 409 `field: form`.
      x-roles: [admin, operator]
      tags: [Panel - Pedidos]
      security: [{ panelSession: [], csrfCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderRef"
        - $ref: "#/components/parameters/CsrfTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [number]
              properties:
                number: { type: string, maxLength: 20, pattern: "^\\s*\\d{1,20}\\s*$" }
                replace: { type: boolean, default: false }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Folio corregido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceResult" }
        "201":
          description: Folio registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # ───────────────────────── Panel: configuración (LN-16) ─────────────────────────
  # Solo Administrador (RF-28, RF-31: el Operador no modifica ni consulta la
  # configuración). Cada escritura queda en audit_log con actor, antes/después y
  # requestId. Editar o desactivar afecta solo compras nuevas: los pedidos guardan
  # su propia copia de descuento, tarifa, comuna y plazo (RN-02).
  /admin/coupons:
    get:
      operationId: adminListCoupons
      summary: Cupones con estado derivado y usos
      description: |
        Todos los cupones, activos primero (activo, programado, agotado, vencido,
        inactivo) y luego por código. El estado se calcula con el día de hoy en
        Chile (`today`). `uses` = usos registrados (reservados + consumidos), que
        cuentan para el cupo.
      x-roles: [admin]
      tags: [Panel - Configuración]
      security: [{ panelSession: [] }]
      responses:
        "200":
          description: Cupones
          content:
            application/json:
              schema:
                type: object
                required: [today, items]
                properties:
                  today: { type: string, format: date, description: Hoy en Chile }
                  items: { type: array, items: { $ref: "#/components/schemas/AdminCoupon" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: adminCreateCoupon
      summary: Crear cupón
      description: |
        Código normalizado (mayúsculas, sin espacios), de 3 a 20 caracteres (A–Z,
        0–9, `-`, `_`), único sin distinguir mayúsculas (422 «Ese código ya
        existe. Usa otro o edita el cupón existente.»; 409 si otra petición se
        adelantó). Porcentaje entero 1–100 o monto entero > 0 (hasta 10.000.000).
        Inicio ≤ término (días de Chile, ambos inclusive). Máximo de usos 1–1.000.000.
        Auditoría `coupon.created`.
      x-roles: [admin]
      tags: [Panel - Configuración]
      security: [{ panelSession: [], csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCouponInput" }
            example:
              {
                code: APRENDER10,
                kind: percent,
                value: 10,
                startsOn: "2026-12-01",
                endsOn: "2026-12-31",
                maxUses: 100,
              }
      responses:
        "201":
          description: Cupón creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCoupon" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/coupons/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: adminGetCoupon
      summary: Cupón
      x-roles: [admin]
      tags: [Panel - Configuración]
      security: [{ panelSession: [] }]
      responses:
        "200":
          description: Cupón
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCoupon" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    patch:
      operationId: adminUpdateCoupon
      summary: Editar, activar o desactivar un cupón
      description: |
        Campos parciales, con las mismas reglas que al crear. Con usos
        (`termsLocked`), código, tipo y valor quedan fijos: cambiarlos responde
        409 «Tiene usos: para otro descuento crea un cupón nuevo.» con
        `details.field` (`code`, `kind` o `value`). El máximo no puede quedar
        bajo los usos registrados (422 en `maxUses`). La fila se bloquea, así una
        compra simultánea que reserve un uso espera. Auditoría `coupon.updated`,
        `coupon.activated` o `coupon.deactivated`.
      x-roles: [admin]
      tags: [Panel - Configuración]
      security: [{ panelSession: [], csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCouponUpdate" }
            example: { active: false }
      responses:
        "200":
          description: Cupón actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCoupon" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      operationId: adminDeleteCoupon
      summary: Eliminar un cupón sin usos (con usos, solo desactivar)
      description: |
        Solo un cupón sin usos, sin canjes (ni liberados) y sin pedidos que lo
        citen (`canDelete`). Si no, 409 «Este cupón tiene usos: solo se puede
        desactivar.». Un carrito que lo tenga aplicado queda sin cupón.
        Auditoría `coupon.deleted`.
      x-roles: [admin]
      tags: [Panel - Configuración]
      security: [{ panelSession: [], csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      responses:
        "204": { description: Cupón eliminado }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/banners:
    get:
      operationId: adminListBanners
      summary: Banners
      description: Todos (activos e inactivos), por orden de aparición y luego por título, con lo que ve hoy la tienda (`visibility`).
      x-roles: [admin]
      tags: [Panel - Configuración]
      security: [{ panelSession: [] }]
      responses:
        "200":
          description: Banners
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminBanner" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: adminCreateBanner
      summary: Crear banner (destino solo interno)
      description: |
        Título hasta 60 y texto hasta 140 (espacios de más colapsados), orden
        entero 1–99. El destino debe ser una ruta de la tienda: empieza con `/`,
        no con `//`, sin `\`, espacios ni caracteres de control (se descartan
        `http:`, `javascript:`, `data:`…). Ventana de publicación opcional
        (`startsAt`/`endsAt`, término posterior al inicio). Auditoría `banner.created`.
      x-roles: [admin]
      tags: [Panel - Configuración]
      security: [{ panelSession: [], csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminBannerInput" }
            example:
              {
                title: Línea JUNJI,
                text: Muebles certificados para salas cuna y jardines.,
                href: /catalogo?categoria=junji,
                sortOrder: 1,
              }
      responses:
        "201":
          description: Banner creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBanner" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/banners/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: adminUpdateBanner
      summary: Editar, activar o desactivar un banner
      description: Campos parciales, mismas reglas que al crear. Auditoría `banner.updated`, `banner.activated` o `banner.deactivated`.
      x-roles: [admin]
      tags: [Panel - Configuración]
      security: [{ panelSession: [], csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminBannerUpdate" }
      responses:
        "200":
          description: Banner actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBanner" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      operationId: adminDeleteBanner
      summary: Desactivar banner (no se eliminan)
      description: Deja el banner inactivo; la portada deja de mostrarlo. Idempotente.
      x-roles: [admin]
      tags: [Panel - Configuración]
      security: [{ panelSession: [], csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      responses:
        "204": { description: Banner desactivado }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/shipping-zones:
    get:
      operationId: adminListShippingZones
      summary: Zonas de despacho a coordinar (comuna, tarifa y plazo)
      description: Todas, de norte a sur y luego por comuna. `price` null = tarifa por confirmar.
      x-roles: [admin]
      tags: [Panel - Configuración]
      security: [{ panelSession: [] }]
      responses:
        "200":
          description: Zonas
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminShippingZone" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: adminCreateShippingZone
      summary: Crear zona
      description: |
        Región (código de Chile) y comuna (hasta 80) únicas: la comuna se compara
        sin tildes, mayúsculas ni espacios de más dentro de la región (422 «Esa
        comuna ya tiene una zona en esta región. Edita la existente.»). Tarifa
        entera 0–1.000.000 o `null` (por confirmar: despacho a coordinar). Plazo
        hasta 60. Auditoría `shipping_zone.created`.
      x-roles: [admin]
      tags: [Panel - Configuración]
      security: [{ panelSession: [], csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminShippingZoneInput" }
            example:
              {
                region: RM,
                commune: Ñuñoa,
                price: null,
                leadTime: A coordinar con el taller,
                freeShippingEligible: true,
              }
      responses:
        "201":
          description: Zona creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminShippingZone" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/shipping-zones/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: adminUpdateShippingZone
      summary: Editar zona (no cambia pedidos anteriores)
      description: Campos parciales, mismas reglas. Los pedidos ya hechos conservan su costo, comuna y plazo (RN-02).
      x-roles: [admin]
      tags: [Panel - Configuración]
      security: [{ panelSession: [], csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminShippingZoneUpdate" }
            example: { price: 4990, leadTime: 3 a 5 días hábiles }
      responses:
        "200":
          description: Zona actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminShippingZone" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      operationId: adminDeactivateShippingZone
      summary: Desactivar zona (no se borran)
      description: Deja de ofrecerse en compras nuevas; esa comuna pasa a «a coordinar». Idempotente.
      x-roles: [admin]
      tags: [Panel - Configuración]
      security: [{ panelSession: [], csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      responses:
        "204": { description: Zona desactivada }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/shipping-settings:
    get:
      operationId: adminGetShippingSettings
      summary: Condiciones de retiro y despacho
      description: Retiro en taller (habilitado, dirección y horario), umbral de despacho gratis y minutos de reserva. Sin configuración guardada, los valores por defecto (`updatedAt` null).
      x-roles: [admin]
      tags: [Panel - Configuración]
      security: [{ panelSession: [] }]
      responses:
        "200":
          description: Configuración vigente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShippingSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: adminUpdateShippingSettings
      summary: Guardar condiciones de retiro y despacho
      description: |
        Reemplaza las condiciones. Dirección y horario de retiro obligatorios (hasta
        200). Umbral entero 0–100.000.000 o `null` (sin despacho gratis); aplica a
        subtotal − descuento y solo en zonas elegibles. Reserva de 1 a 120 minutos
        (RN-04). Afecta solo compras nuevas. Auditoría `settings.shipping_updated`.
      x-roles: [admin]
      tags: [Panel - Configuración]
      security: [{ panelSession: [], csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShippingSettingsInput" }
            example:
              {
                pickupEnabled: true,
                pickupDetails: "Taller Total Kids, Temuco · L a V 10–18 h",
                freeShippingThreshold: 150000,
                reservationMinutes: 30,
              }
      responses:
        "200":
          description: Configuración actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShippingSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/store-theme:
    get:
      operationId: adminGetStoreTheme
      summary: Plantilla activa de la tienda y las disponibles
      x-roles: [admin]
      tags: [Panel - Configuración]
      security: [{ panelSession: [] }]
      responses:
        "200":
          description: Plantilla
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminStoreTheme" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: adminSetStoreTheme
      summary: Activar una plantilla (solo una a la vez)
      description: Auditoría `settings.theme_changed`. La tienda la lee en `GET /store-theme`.
      x-roles: [admin]
      tags: [Panel - Configuración]
      security: [{ panelSession: [], csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [theme]
              properties:
                theme: { $ref: "#/components/schemas/StoreThemeId" }
            example: { theme: navidad }
      responses:
        "200":
          description: Plantilla activada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminStoreTheme" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # ───────────────────────── Panel: solicitudes y newsletter (LN-16) ─────────────────────────
  /admin/service-requests:
    get:
      operationId: adminListServiceRequests
      summary: Solicitudes de servicio
      description: |
        Más recientes primero. `q` busca por referencia ("SOL-1002"), nombre o
        correo. `counts` cuenta por estado con los demás filtros (para las pestañas).
      x-roles: [admin, operator]
      tags: [Panel - Solicitudes y newsletter]
      security: [{ panelSession: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: service
          in: query
          schema:
            type: string
            enum: [armado, diseno, personalizacion, instituciones, regalos, garantia]
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ServiceRequestStatus" } }
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
      responses:
        "200":
          description: Página de solicitudes
          content:
            application/json:
              schema:
                type: object
                required: [items, meta, counts]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminServiceRequestSummary" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
                  counts:
                    type: object
                    required: [new, in_progress, resolved]
                    properties:
                      new: { type: integer }
                      in_progress: { type: integer }
                      resolved: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/service-requests/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Uuid de la solicitud o su referencia ("SOL-1002" o "1002").
        schema: { type: string, example: SOL-1002 }
    get:
      operationId: adminGetServiceRequest
      summary: Detalle de solicitud con historial
      description: |
        Datos completos (con mensaje y teléfono), nota interna, estados que se
        pueden elegir (`statusOptions`), historial (la recepción y cada cambio de
        `audit_log`, con rol y nombre de quien lo hizo) y correos de la solicitud.
      x-roles: [admin, operator]
      tags: [Panel - Solicitudes y newsletter]
      security: [{ panelSession: [] }]
      responses:
        "200":
          description: Solicitud
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminServiceRequestDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    patch:
      operationId: adminUpdateServiceRequest
      summary: Cambiar estado o nota interna
      description: |
        Nueva → En gestión → Resuelta; se puede resolver directo desde Nueva y
        reabrir una resuelta (vuelve a En gestión); nunca se vuelve a Nueva (409
        «Una solicitud resuelta no puede pasar a «Nueva».», `details.field:
        status`). Nota interna hasta 1000 caracteres ("" la borra). Sin cambios:
        422 «No hay cambios para guardar.». La fila se bloquea. Auditoría
        `service_request.updated` (sin el texto de la nota).
      x-roles: [admin, operator]
      tags: [Panel - Solicitudes y newsletter]
      security: [{ panelSession: [], csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceRequestFollowUpInput" }
            example: { status: in_progress, note: Llamar el lunes para agendar. }
      responses:
        "200":
          description: Solicitud actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminServiceRequestDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/newsletter:
    get:
      operationId: adminListSubscribers
      summary: Suscriptores del newsletter
      description: Del consentimiento más reciente al más antiguo. `q` busca en el correo; `counts` por estado.
      x-roles: [admin]
      tags: [Panel - Solicitudes y newsletter]
      security: [{ panelSession: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - { name: status, in: query, schema: { type: string, enum: [active, unsubscribed] } }
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
      responses:
        "200":
          description: Página de suscriptores
          content:
            application/json:
              schema:
                type: object
                required: [items, meta, counts]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminSubscriber" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
                  counts:
                    type: object
                    required: [active, unsubscribed]
                    properties:
                      active: { type: integer }
                      unsubscribed: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/newsletter/{id}/unsubscribe:
    post:
      operationId: adminUnsubscribeSubscriber
      summary: Registrar la baja desde el panel (conserva el registro)
      description: |
        Deja el suscriptor `unsubscribed` con la fecha y el rol que la registró;
        no borra nada. Ya de baja: 409 «Ese suscriptor ya estaba dado de baja.»
        (la fecha original no cambia). Auditoría `newsletter.unsubscribed` (sin el correo).
      x-roles: [admin]
      tags: [Panel - Solicitudes y newsletter]
      security: [{ panelSession: [], csrfCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CsrfTokenHeader"
      responses:
        "200":
          description: Baja registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSubscriber" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # ───────────────────────── Panel: reportes y exportaciones (LN-16) ─────────────────────────
  # Solo Administrador: la tabla de la API de la SRS manda sobre UC-08.
  /admin/reports/sales:
    get:
      operationId: adminSalesReport
      summary: Ventas por período, producto y medio de pago
      description: |
        RF-30. Una venta es un cobro confirmado (`payments.status = paid`) y cae
        en el período por la fecha del cobro en días de Chile. Los reembolsos van
        aparte: cuentan los procesados cuya fecha cae en el período, aunque el
        cobro sea de otro (`criteria` lo explica para la pantalla). Neto = cobros −
        reembolsos. Por producto: líneas al precio de compra, antes del descuento.
        Sin fechas: el mes en curso hasta hoy. Período de hasta un año (422 con
        los textos del panel en `from`/`to`).
      x-roles: [admin]
      tags: [Panel - Reportes]
      security: [{ panelSession: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Reporte
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/exports/{resource}:
    get:
      operationId: adminExport
      summary: Exportación CSV (fórmulas neutralizadas)
      description: |
        RF-29. CSV UTF-8 con BOM, separador `;`, fin de línea CRLF y cada celda
        entre comillas; una celda que empieza con `=`, `+`, `-`, `@`, tabulador o
        retorno se antepone con `'`. Acepta los mismos filtros que el listado de
        cada pantalla:

        - `orders`: los de `GET /admin/orders` (`q`, `status`, `paymentStatus`,
          `deliveryMethod`, `invoicePending`, `from`, `to`). Columnas: Pedido,
          Fecha, Cliente, Correo, Estado, Pago, Total CLP (sin RUT, teléfono ni dirección).
        - `sales`: `from`, `to` (como el reporte). Una fila por cobro del período.
        - `service-requests`: `service`, `status`, `q`. Sin teléfono, mensaje ni nota.
        - `subscribers`: `status`, `q`. Correo, consentimiento (fecha y versión), estado y baja.

        Fechas en hora de Chile ("AAAA-MM-DD HH:mm"). Máximo 5.000 filas (422
        «Acota los filtros.»). La cabecera `X-Export-Rows` trae las filas. Cada
        descarga queda en audit_log (`export.downloaded`, recurso, filtros y filas).
      x-roles: [admin]
      tags: [Panel - Reportes]
      security: [{ panelSession: [] }]
      parameters:
        - name: resource
          in: path
          required: true
          schema: { type: string, enum: [orders, sales, service-requests, subscribers] }
      responses:
        "200":
          description: Archivo CSV
          headers:
            Content-Disposition:
              schema:
                {
                  type: string,
                  example: 'attachment; filename="total-kids-pedidos-2026-11-23.csv"',
                }
            X-Export-Rows: { schema: { type: integer } }
          content:
            text/csv:
              schema: { type: string }
              example: "﻿\"Pedido\";\"Fecha\";\"Cliente\"\r\n\"TK-1048\";\"2026-11-23 10:15\";\"'=Camila\""
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # ───────────────────────── Panel: resumen, pagos y actividad (LN-16) ─────────────────────────
  /admin/summary:
    get:
      operationId: adminSummary
      summary: Resumen del panel
      description: |
        Pedidos por estado, pagos en revisión y pendientes (último intento) y los 5
        pedidos más recientes. Cobros y reembolsos del mes y stock bajo solo para
        el Administrador; para el Operador llegan en `null`.
      x-roles: [admin, operator]
      tags: [Panel - Resumen]
      security: [{ panelSession: [] }]
      responses:
        "200":
          description: Resumen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanelSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/payments:
    get:
      operationId: adminListPayments
      summary: Intentos de pago (solo lectura)
      description: |
        Para «Pagos y conciliación» (RF-33). Más recientes primero. `current`
        marca el último intento del pedido y `reconcilable` el que sigue pendiente
        o en revisión. La conciliación con Flow es de LN-15 y no está aquí.
      x-roles: [admin, operator]
      tags: [Panel - Pagos]
      security: [{ panelSession: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema: { type: string, enum: [pending, paid, rejected, voided, in_review, expired] }
        - name: order
          in: query
          description: Pedido ("TK-1048", "1048" o uuid).
          schema: { type: string }
      responses:
        "200":
          description: Página de intentos
          content:
            application/json:
              schema:
                type: object
                required: [items, meta, counts]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminPayment" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
                  counts:
                    type: object
                    additionalProperties: { type: integer }
                    description: Intentos por estado (con el filtro de pedido).
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/activity:
    get:
      operationId: adminActivity
      summary: Historial de actividad (audit_log)
      description: |
        RF-27, RF-34. Quién hizo qué, cuándo y por qué, más reciente primero. El
        responsable se identifica por su cuenta: `actorName` es el nombre de la
        persona y `actorLabel` el rol con que actuó; el filtro `actor` es el id de
        la cuenta. Áreas por recurso afectado; los ingresos al panel no se listan.
        `actors` y `byArea` alimentan los filtros.
      x-roles: [admin]
      tags: [Panel - Usuarios]
      security: [{ panelSession: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - { name: area, in: query, schema: { $ref: "#/components/schemas/ActivityArea" } }
        - { name: actor, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Página del historial
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # ───────────────────────── Panel: usuarios (LN-16) y correos (LN-14, LN-16) ─────────────────────────
  # Usuarios: solo Administrador. Siempre queda al menos un Administrador activo;
  # nadie se quita el rol ni se desactiva a sí mismo. Cambiar el rol o desactivar
  # revoca todas las sesiones de la cuenta (RNF-01). Las cuentas no se eliminan.
  /admin/users:
    get:
      operationId: adminListUsers
      summary: Cuentas internas del panel
      description: Administradores primero, luego activas, luego por nombre. Nunca trae contraseñas ni hashes.
      x-roles: [admin]
      tags: [Panel - Usuarios]
      security: [{ panelSession: [] }]
      responses:
        "200":
          description: Cuentas
          content:
            application/json:
              schema:
                type: object
                required: [items, activeAdmins]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
                  activeAdmins: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: adminCreateUser
      summary: Crear una cuenta (con correo para definir la contraseña)
      description: |
        Nombre (hasta 120), correo válido y único (se guarda en minúsculas; 422
        «Ya existe una cuenta con ese correo.») y rol. La cuenta nace con una
        contraseña aleatoria que nadie conoce y, si queda activa, se le encola
        `password_recovery` (`invitationSent: true`) para que defina la suya en
        `/admin/restablecer?token=…` (el enlace vence a los 30 minutos; si vence,
        se pide otro con «Olvidé mi contraseña»). Auditoría `user.created`.
      x-roles: [admin]
      tags: [Panel - Usuarios]
      security: [{ panelSession: [], csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserInput" }
            example: { name: Paula Rojas, email: paula@totalkids.cl, role: operator }
      responses:
        "201":
          description: Cuenta creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/users/{id}:
    patch:
      operationId: adminUpdateUser
      summary: Editar nombre, correo, rol o estado de una cuenta
      description: |
        El formulario completo de la pantalla, con las mismas reglas que
        `PATCH /admin/users/{id}/role`. 409 (`details.field: form`): dejaría el
        panel sin Administradores activos, o te quitas el rol o te desactivas a ti
        mismo. Cambiar el rol o el estado revoca las sesiones (`sessionsRevoked`).
        Auditoría `user.updated`, `user.role_changed`, `user.activated` o `user.deactivated`.
      x-roles: [admin]
      tags: [Panel - Usuarios]
      security: [{ panelSession: [], csrfCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CsrfTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserUpdate" }
            example: { active: false }
      responses:
        "200":
          description: Cuenta actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserChanged" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/users/{id}/role:
    patch:
      operationId: adminChangeUserRole
      summary: Cambiar el rol de un usuario interno
      description: |
        409 «Debe quedar al menos un Administrador activo. Asigna o activa otro
        antes de este cambio.» o «No puedes quitarte el rol de Administrador.…».
        Revoca todas las sesiones de la cuenta (RNF-01): el permiso nuevo rige de
        inmediato. Auditoría `user.role_changed`.
      x-roles: [admin]
      tags: [Panel - Usuarios]
      security: [{ panelSession: [], csrfCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CsrfTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { type: string, enum: [admin, operator] }
            example: { role: admin }
      responses:
        "200":
          description: Rol actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserChanged" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/emails:
    get:
      operationId: adminListEmails
      summary: Registro de correos transaccionales
      description: |
        RF-21, SRS 4.4.3. Más recientes primero, con `counts` por estado. El
        Operador no ve los correos de recuperación de contraseña ni los de baja
        del newsletter. `canResend` indica si el Administrador puede reenviarlo.
      x-roles: [admin, operator]
      tags: [Panel - Correos]
      security: [{ panelSession: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - { name: event, in: query, schema: { $ref: "#/components/schemas/EmailEvent" } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/EmailStatus" } }
        - name: order
          in: query
          description: Pedido ("TK-1048", "1048" o uuid).
          schema: { type: string }
        - name: request
          in: query
          description: Solicitud ("SOL-1002", "1002" o uuid).
          schema: { type: string }
      responses:
        "200":
          description: Página de correos
          content:
            application/json:
              schema:
                type: object
                required: [items, meta, counts]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminEmailSummary" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
                  counts:
                    type: object
                    required: [pending, sent, failed, uncertain]
                    properties:
                      pending: { type: integer }
                      sent: { type: integer }
                      failed: { type: integer }
                      uncertain: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/emails/{id}:
    get:
      operationId: adminGetEmail
      summary: Detalle de un correo con sus intentos y reenvíos
      x-roles: [admin, operator]
      tags: [Panel - Correos]
      security: [{ panelSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Correo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminEmailDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/emails/{id}/resend:
    post:
      operationId: adminResendEmail
      summary: Reenvío manual auditado de un correo fallido o incierto
      description: |
        Solo Administrador (RF-21). Solo sobre un correo `failed` o `uncertain`.
        Crea un registro nuevo vinculado al original (`resendOf`) y lo encola: el
        worker hace un único intento y registra el intento manual con el actor,
        en el registro nuevo y en el original (cuyo estado pasa a reflejar el
        resultado). Deja la operación en `audit_log` (`email.resent`). Nunca
        modifica el pedido ni la solicitud.

        409 si el correo no está fallido o incierto, si ya hay un reenvío en
        curso, o si es una recuperación de contraseña (se pide de nuevo desde el
        ingreso al panel).
      x-roles: [admin]
      tags: [Panel - Correos]
      security: [{ panelSession: [], csrfCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: Id del registro de correo (UUID).
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CsrfTokenHeader"
      responses:
        "202":
          description: Reenvío encolado
          content:
            application/json:
              schema:
                type: object
                required: [id, status, resendOf]
                properties:
                  id: { type: string, format: uuid, description: Registro nuevo del reenvío }
                  status: { type: string, enum: [pending] }
                  resendOf: { type: string, format: uuid, description: Registro original }
              example:
                {
                  id: 0195f3a0-7c1e-7d2a-9b44-2f1c3a5d6e70,
                  status: pending,
                  resendOf: 0195f3a0-1b2c-7d3e-8f40-1a2b3c4d5e6f,
                }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

components:
  schemas:
    ErrorBody:
      type: object
      description: Formato estándar de error de la API.
      required: [code, message, details, requestId]
      properties:
        code:
          type: string
          description: Código legible por máquina (catálogo en la descripción de la API).
          enum:
            - BAD_REQUEST
            - UNAUTHORIZED
            - FORBIDDEN
            - CSRF_FAILED
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - CONFLICT
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - VALIDATION_ERROR
            - RATE_LIMITED
            - INTERNAL_ERROR
            - DATABASE_UNAVAILABLE
        message:
          type: string
          description: Mensaje en español para personas; puede cambiar.
        details:
          description: Información adicional (p. ej. errores de validación) o null.
        requestId:
          type: string
          description: Identificador de la petición (cabecera X-Request-Id).
    ValidationIssue:
      type: object
      required: [location, path, message]
      properties:
        location: { type: string, enum: [body, query, params] }
        path:
          type: string
          description: Ruta con puntos ("items.0.quantity"); vacía si es el objeto entero.
        message: { type: string, description: Mensaje en español }
    Image:
      type: object
      required: [url, alt, width, height]
      properties:
        url: { type: string }
        alt: { type: string }
        width: { type: [integer, "null"] }
        height: { type: [integer, "null"] }
    ProductSummary:
      type: object
      required:
        [
          slug,
          name,
          summary,
          category,
          categories,
          ageGroups,
          materials,
          colors,
          price,
          compareAtPrice,
          onSale,
          featured,
          availability,
          publishedAt,
          image,
        ]
      properties:
        slug: { type: string }
        name: { type: string }
        summary: { type: [string, "null"] }
        category:
          type: object
          required: [slug, name]
          properties:
            slug: { type: string }
            name: { type: string }
        categories:
          type: array
          items: { type: string }
          description: Slugs de la categoría principal (primero) y de las adicionales activas.
        ageGroups: { type: array, items: { type: string } }
        materials: { type: array, items: { type: string } }
        colors:
          type: array
          items: { type: string }
          description: Colores de las variantes activas, sin repetir y en su orden.
        price:
          type: [integer, "null"]
          description: Menor precio en CLP entre las variantes; null mientras no esté definido.
        compareAtPrice:
          type: [integer, "null"]
          description: Precio anterior de la variante más barata, si está en oferta.
        onSale: { type: boolean }
        featured: { type: boolean }
        availability: { type: string, enum: [en_stock, a_pedido] }
        publishedAt: { type: string, format: date-time }
        image:
          oneOf: [{ $ref: "#/components/schemas/Image" }, { type: "null" }]
    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/ProductSummary"
        - type: object
          required: [description, dimensions, optionName, leadTime, specs, images, variants, extras]
          properties:
            description: { type: string }
            dimensions: { type: [string, "null"] }
            optionName:
              type: [string, "null"]
              description: Qué se elige entre variantes ("Tamaño", "Color"); null con una sola variante.
            leadTime:
              type: [string, "null"]
              description: Plazo de fabricación a pedido; null = plazo general de la tienda.
            specs:
              type: array
              items:
                type: object
                properties:
                  label: { type: string }
                  value: { type: string }
            images:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/Image"
                  - type: object
                    properties:
                      variantSku: { type: [string, "null"] }
            variants:
              type: array
              items:
                type: object
                required:
                  [sku, optionLabel, color, size, price, compareAtPrice, available, availability]
                properties:
                  sku: { type: string }
                  optionLabel: { type: [string, "null"] }
                  color: { type: [string, "null"] }
                  size: { type: [string, "null"] }
                  price: { type: [integer, "null"] }
                  compareAtPrice: { type: [integer, "null"] }
                  available:
                    type: integer
                    minimum: 0
                    description: Unidades disponibles (físico − reservado). 0 = a pedido.
                  availability: { type: string, enum: [en_stock, a_pedido] }
            extras:
              type: array
              items:
                type: object
                required: [code, name, price, personalization]
                properties:
                  code: { type: string }
                  name: { type: string }
                  price:
                    type: [integer, "null"]
                    description: null = precio por confirmar (no suma al total).
                  personalization:
                    oneOf:
                      - type: object
                        required: [label, maxLength]
                        properties:
                          label: { type: string }
                          maxLength: { type: integer }
                      - type: "null"
    Category:
      type: object
      required: [slug, name, description, productCount]
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        productCount: { type: integer, minimum: 0 }
    PanelUser:
      type: object
      required: [id, email, name, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [admin, operator] }
    PanelSession:
      type: object
      required: [user, expiresAt]
      properties:
        user: { $ref: "#/components/schemas/PanelUser" }
        expiresAt:
          type: string
          format: date-time
          description: Vencimiento absoluto; antes vence si pasan 2 h sin uso.
    PageMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    CsrfToken:
      type: string
      description: "base64url(nonce).base64url(HMAC-SHA256)"
      pattern: "^[A-Za-z0-9_-]{43}\\.[A-Za-z0-9_-]{43}$"

    # ── Panel: catálogo e inventario (LN-12) ──
    AdminCategoryRef:
      type: object
      required: [id, slug, name, active]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        active: { type: boolean }
    AdminVariant:
      type: object
      required:
        [
          id,
          sku,
          optionLabel,
          color,
          size,
          price,
          compareAtPrice,
          stockPhysical,
          stockReserved,
          available,
          active,
          sortOrder,
        ]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string, description: En mayúsculas; único sin distinguir mayúsculas. }
        optionLabel: { type: [string, "null"] }
        color: { type: [string, "null"] }
        size: { type: [string, "null"] }
        price:
          {
            type: [integer, "null"],
            minimum: 0,
            description: CLP; null = por definir (no se puede publicar).,
          }
        compareAtPrice: { type: [integer, "null"], minimum: 0 }
        stockPhysical: { type: integer, minimum: 0 }
        stockReserved: { type: integer, minimum: 0 }
        available:
          { type: integer, minimum: 0, description: físico − reservado (RN-03); 0 = a pedido. }
        active: { type: boolean }
        sortOrder: { type: integer }
    AdminImage:
      type: object
      required: [id, url, alt, width, height, sortOrder, variantId]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        alt: { type: string }
        width: { type: [integer, "null"] }
        height: { type: [integer, "null"] }
        sortOrder: { type: integer }
        variantId: { type: [string, "null"], format: uuid }
    AdminProductExtra:
      type: object
      required:
        [
          code,
          name,
          requiresText,
          textLabel,
          price,
          textMaxLength,
          effectivePrice,
          effectiveTextMaxLength,
          available,
          sortOrder,
        ]
      properties:
        code: { type: string }
        name: { type: string }
        requiresText: { type: boolean }
        textLabel: { type: [string, "null"] }
        price: { type: [integer, "null"], description: Propio del producto; null = el del extra. }
        textMaxLength:
          { type: [integer, "null"], description: Propio del producto; null = el del extra. }
        effectivePrice:
          { type: [integer, "null"], description: Lo que ve el comprador; null = por confirmar. }
        effectiveTextMaxLength: { type: [integer, "null"] }
        available: { type: boolean }
        sortOrder: { type: integer }
    AdminProduct:
      type: object
      required:
        [
          id,
          slug,
          name,
          summary,
          description,
          dimensions,
          ageGroups,
          materials,
          specs,
          optionName,
          leadTime,
          status,
          featured,
          publishedAt,
          createdAt,
          updatedAt,
          category,
          additionalCategories,
          variants,
          images,
          extras,
        ]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        summary: { type: [string, "null"] }
        description: { type: string }
        dimensions: { type: [string, "null"] }
        ageGroups: { type: array, items: { type: string } }
        materials: { type: array, items: { type: string } }
        specs:
          type: array
          items:
            type: object
            properties: { label: { type: string }, value: { type: string } }
        optionName: { type: [string, "null"] }
        leadTime: { type: [string, "null"] }
        status: { type: string, enum: [draft, active, inactive] }
        featured: { type: boolean }
        publishedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        category: { $ref: "#/components/schemas/AdminCategoryRef" }
        additionalCategories:
          { type: array, items: { $ref: "#/components/schemas/AdminCategoryRef" } }
        variants: { type: array, items: { $ref: "#/components/schemas/AdminVariant" } }
        images: { type: array, items: { $ref: "#/components/schemas/AdminImage" } }
        extras: { type: array, items: { $ref: "#/components/schemas/AdminProductExtra" } }
    AdminProductSummary:
      type: object
      required:
        [
          id,
          slug,
          name,
          status,
          featured,
          category,
          price,
          variantCount,
          available,
          image,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        status: { type: string, enum: [draft, active, inactive] }
        featured: { type: boolean }
        category: { $ref: "#/components/schemas/AdminCategoryRef" }
        price: { type: [integer, "null"], description: Menor precio entre las variantes activas. }
        variantCount: { type: integer, description: Variantes activas. }
        available: { type: integer, description: Unidades disponibles de las variantes activas. }
        image:
          oneOf:
            - type: object
              required: [url, alt]
              properties: { url: { type: string }, alt: { type: string } }
            - type: "null"
        updatedAt: { type: string, format: date-time }
    AdminVariantInput:
      type: object
      additionalProperties: false
      required: [sku]
      properties:
        id: { type: string, format: uuid, description: Solo al editar una variante existente. }
        sku: { type: string, maxLength: 40, pattern: "^\\S+$" }
        optionLabel: { type: [string, "null"], maxLength: 60 }
        color: { type: [string, "null"], maxLength: 60 }
        size: { type: [string, "null"], maxLength: 60 }
        price: { type: [integer, "null"], minimum: 0 }
        compareAtPrice:
          type: [integer, "null"]
          minimum: 0
          description: Igual o mayor al precio; igual = sin oferta (se guarda null).
        stockPhysical:
          type: integer
          minimum: 0
          description: Solo en variantes nuevas; las existentes se ajustan con stock-adjustments.
        active: { type: boolean, default: true }
    AdminExtraInput:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string }
        price: { type: [integer, "null"], minimum: 0 }
        textMaxLength:
          type: [integer, "null"]
          minimum: 1
          maximum: 100
          description: Solo para extras que piden texto.
    AdminProductUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        summary: { type: [string, "null"], maxLength: 400 }
        description: { type: string, minLength: 1, maxLength: 4000 }
        dimensions: { type: [string, "null"], maxLength: 200 }
        ageGroups: { type: array, maxItems: 10, items: { type: string } }
        materials: { type: array, maxItems: 10, items: { type: string } }
        specs:
          type: array
          maxItems: 30
          items:
            type: object
            required: [label, value]
            properties:
              label: { type: string, maxLength: 60 }
              value: { type: string, maxLength: 200 }
        optionName:
          type: [string, "null"]
          maxLength: 40
          description: Obligatorio con más de una variante activa.
        leadTime: { type: [string, "null"], maxLength: 60 }
        featured: { type: boolean }
        status: { type: string, enum: [draft, active, inactive] }
        categoryId: { type: string, format: uuid }
        additionalCategoryIds: { type: array, maxItems: 10, items: { type: string, format: uuid } }
        variants:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/AdminVariantInput" }
        extras:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/AdminExtraInput" }
    AdminProductCreate:
      allOf:
        - $ref: "#/components/schemas/AdminProductUpdate"
        - type: object
          required: [name, description, categoryId, variants]
    AdminCategory:
      type: object
      required: [id, slug, name, description, sortOrder, active, productCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        sortOrder: { type: integer }
        active: { type: boolean }
        productCount:
          type: integer
          minimum: 0
          description: Productos que la usan como principal o adicional, en cualquier estado.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminCategoryInput:
      type: object
      additionalProperties: false
      description: Al crear, `name` es obligatorio. Al editar, campos parciales.
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        description: { type: [string, "null"], maxLength: 500 }
        sortOrder: { type: integer, minimum: 0 }
        active: { type: boolean }
    AdminCategoryDeactivation:
      type: object
      required: [category, productsUsingCount, hiddenProductsCount, warning]
      properties:
        category: { $ref: "#/components/schemas/AdminCategory" }
        productsUsingCount: { type: integer, minimum: 0 }
        hiddenProductsCount:
          type: integer
          minimum: 0
          description: Publicados que la tienen como principal (dejan de verse en la tienda).
        warning: { type: [string, "null"] }
    AdminExtra:
      type: object
      required: [id, code, name, price, available, requiresText, textLabel, textMaxLength]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        price: { type: [integer, "null"] }
        available: { type: boolean }
        requiresText: { type: boolean }
        textLabel: { type: [string, "null"] }
        textMaxLength: { type: [integer, "null"] }
    StockAdjustmentInput:
      type: object
      additionalProperties: false
      required: [variantId, stockPhysical, reason]
      properties:
        variantId: { type: string, format: uuid }
        stockPhysical:
          type: integer
          minimum: 0
          description: Nuevo stock físico (absoluto), no menor que lo reservado.
        reason: { type: string, minLength: 1, maxLength: 200 }
    InventoryMovement:
      type: object
      required:
        [
          id,
          createdAt,
          kind,
          variantId,
          sku,
          physicalBefore,
          physicalAfter,
          physicalDelta,
          reservedBefore,
          reservedAfter,
          reservedDelta,
          reason,
          orderId,
          actorLabel,
          actorName,
        ]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        kind: { type: string, enum: [reservation, release, sale, adjustment, restock] }
        variantId: { type: string, format: uuid }
        sku: { type: string }
        physicalBefore: { type: integer }
        physicalAfter: { type: integer }
        physicalDelta: { type: integer }
        reservedBefore: { type: integer }
        reservedAfter: { type: integer }
        reservedDelta: { type: integer }
        reason: { type: string }
        orderId: { type: [string, "null"], format: uuid }
        actorLabel:
          type: string
          description: 'Rol al momento ("Administrador" o "Sistema").'
        actorName: { type: [string, "null"] }
    InventoryRow:
      type: object
      required:
        [
          variantId,
          sku,
          optionLabel,
          variantActive,
          productId,
          productName,
          productSlug,
          productStatus,
          stockPhysical,
          stockReserved,
          available,
        ]
      properties:
        variantId: { type: string, format: uuid }
        sku: { type: string }
        optionLabel: { type: [string, "null"] }
        variantActive: { type: boolean }
        productId: { type: string, format: uuid }
        productName: { type: string }
        productSlug: { type: string }
        productStatus: { type: string, enum: [draft, active, inactive] }
        stockPhysical: { type: integer, minimum: 0 }
        stockReserved: { type: integer, minimum: 0 }
        available:
          { type: integer, minimum: 0, description: físico − reservado (RN-03); 0 = a pedido. }
    StockAdjustmentResult:
      type: object
      required: [variant, movement]
      properties:
        variant:
          type: object
          required: [id, sku, stockPhysical, stockReserved, available]
          properties:
            id: { type: string, format: uuid }
            sku: { type: string }
            stockPhysical: { type: integer }
            stockReserved: { type: integer }
            available: { type: integer }
        movement: { $ref: "#/components/schemas/InventoryMovement" }
    # ── Carrito (LN-06) ──
    CartNotice:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [product_removed, extra_removed, quantity_adjusted, unpriced, coupon_removed]
        message: { type: string, description: Texto para el comprador (español). }
    CartLine:
      type: object
      required:
        - id
        - sku
        - optionLabel
        - quantity
        - status
        - product
        - variantPrice
        - compareAtPrice
        - unitPrice
        - lineTotal
        - extras
        - availability
        - notices
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        optionLabel: { type: [string, "null"] }
        quantity: { type: integer, minimum: 1, maximum: 9 }
        status:
          type: string
          enum: [ok, unpriced, unavailable]
          description: |
            `unavailable`: el producto o la variante ya no se vende (fuera de los
            totales; se quita en la siguiente escritura). `unpriced`: sin precio
            definido (bloquea el pago).
        product:
          type: object
          required: [slug, name, leadTime, image]
          properties:
            slug: { type: string }
            name: { type: string }
            leadTime:
              type: [string, "null"]
              description: Plazo a pedido; null = plazo general de la tienda.
            image:
              oneOf:
                - { $ref: "#/components/schemas/Image" }
                - { type: "null" }
        variantPrice: { type: [integer, "null"] }
        compareAtPrice: { type: [integer, "null"] }
        unitPrice:
          type: [integer, "null"]
          description: Variante + extras con precio, por unidad (CLP).
        lineTotal: { type: [integer, "null"] }
        extras:
          type: array
          items:
            type: object
            required: [code, name, price, text]
            properties:
              code: { type: string }
              name: { type: string }
              price:
                type: [integer, "null"]
                description: null = por confirmar (no suma).
              text: { type: [string, "null"] }
        availability:
          type: object
          required: [status, inStock, leadTime, message]
          properties:
            status: { type: string, enum: [en_stock, mixto, a_pedido] }
            inStock: { type: integer }
            leadTime: { type: [string, "null"] }
            message: { type: string }
        notices:
          type: array
          items: { $ref: "#/components/schemas/CartNotice" }
    Cart:
      type: object
      required: [lines, notices, coupon, totals, freeShipping, canCheckout]
      properties:
        lines:
          type: array
          items: { $ref: "#/components/schemas/CartLine" }
        notices:
          type: array
          description: Ajustes del carrito (productos quitados, cupón que dejó de valer…).
          items: { $ref: "#/components/schemas/CartNotice" }
        coupon:
          oneOf:
            - type: object
              required: [code, kind, value, discount, valid, reason]
              properties:
                code: { type: string }
                kind: { type: string, enum: [percent, amount] }
                value: { type: integer }
                discount: { type: integer }
                valid: { type: boolean }
                reason:
                  type: [string, "null"]
                  enum: [inactive, not_started, expired, exhausted, null]
            - { type: "null" }
        totals:
          type: object
          required: [units, subtotal, discount, totalWithoutShipping, unpriced]
          properties:
            units: { type: integer }
            subtotal:
              type: integer
              description: Productos y extras con precio (subtotal elegible).
            discount: { type: integer }
            totalWithoutShipping: { type: integer, description: subtotal − descuento. }
            unpriced:
              type: array
              description: Productos o servicios con precio por confirmar (no suman).
              items: { type: string }
        freeShipping:
          description: Avance hacia el despacho gratis sobre subtotal − descuento; null sin umbral.
          oneOf:
            - type: object
              required: [threshold, remaining, percent, reached]
              properties:
                threshold: { type: integer }
                remaining: { type: integer }
                percent: { type: integer }
                reached: { type: boolean }
            - { type: "null" }
        canCheckout:
          type: boolean
          description: Hay algo que comprar y ninguna línea sin precio.

    GuestOrder:
      type: object
      required:
        [
          orderNumber,
          status,
          statusLabel,
          createdAt,
          paymentDueAt,
          paidAt,
          buyer,
          delivery,
          billing,
          items,
          totals,
          couponCode,
          paymentStatus,
          history,
        ]
      properties:
        orderNumber: { type: string, example: TK-1001 }
        status:
          type: string
          enum:
            [
              pending_payment,
              in_review,
              confirmed,
              preparing,
              shipped,
              delivered,
              cancelled,
              expired,
            ]
        statusLabel: { type: string, example: Pendiente de pago }
        createdAt: { type: string, format: date-time }
        paymentDueAt: { type: string, format: date-time }
        paidAt: { type: [string, "null"], format: date-time }
        buyer:
          type: object
          required: [name, email]
          properties:
            name: { type: string }
            email: { type: string, format: email }
        delivery:
          oneOf:
            - type: object
              required: [method, pickupDetails]
              properties:
                method: { const: retiro }
                pickupDetails: { type: [string, "null"] }
            - type: object
              required: [method, address, region, commune, notes, leadTime, tracking]
              properties:
                method: { const: despacho }
                address: { type: string }
                region: { type: [string, "null"] }
                commune: { type: [string, "null"] }
                notes: { type: [string, "null"] }
                leadTime: { type: [string, "null"] }
                tracking:
                  oneOf:
                    - type: "null"
                    - type: object
                      required: [carrier, code]
                      properties:
                        carrier: { type: string }
                        code: { type: string }
        billing:
          type: object
          required: [document, businessName, invoice]
          properties:
            document: { type: string, enum: [boleta, factura] }
            businessName: { type: [string, "null"] }
            invoice:
              oneOf:
                - type: "null"
                - type: object
                  required: [folio, issuedAt]
                  properties:
                    folio: { type: string }
                    issuedAt: { type: string, format: date-time }
        items:
          type: array
          items: { type: object, description: Igual que CreatedOrder.items }
        totals:
          type: object
          required: [subtotal, discount, shipping, total]
          properties:
            subtotal: { type: integer }
            discount: { type: integer }
            shipping: { type: [integer, "null"] }
            total: { type: integer }
        couponCode: { type: [string, "null"] }
        paymentStatus:
          type: [string, "null"]
          description: Estado del último intento en Flow (pending, paid, rejected, voided, in_review, expired)
        history:
          type: array
          items:
            type: object
            required: [status, label, at]
            properties:
              status: { type: string }
              label: { type: string }
              at: { type: string, format: date-time }

    CreatedOrder:
      type: object
      required: [orderNumber, status, paymentDueAt, totals, delivery, items, accessToken]
      properties:
        orderNumber: { type: string, example: TK-1001 }
        status: { const: pending_payment }
        paymentDueAt: { type: string, format: date-time, description: La reserva vence ahí (RN-04) }
        totals:
          type: object
          required: [subtotal, discount, shipping, total]
          properties:
            subtotal: { type: integer }
            discount: { type: integer }
            shipping:
              { type: [integer, "null"], description: null = despacho por confirmar (no suma) }
            total: { type: integer }
        delivery:
          type: object
          required: [method, leadTime]
          properties:
            method: { type: string, enum: [retiro, despacho] }
            leadTime: { type: [string, "null"] }
        items:
          type: array
          items:
            type: object
            required:
              [
                sku,
                productName,
                optionLabel,
                quantity,
                unitPrice,
                extrasUnitPrice,
                lineTotal,
                madeToOrder,
                leadTime,
                extras,
              ]
            properties:
              sku: { type: string }
              productName: { type: string }
              optionLabel: { type: [string, "null"] }
              quantity: { type: integer }
              unitPrice: { type: integer }
              extrasUnitPrice: { type: integer }
              lineTotal: { type: integer }
              madeToOrder:
                { type: boolean, description: No alcanzaron las unidades terminadas (UI-11) }
              leadTime: { type: [string, "null"] }
              extras: { type: array, items: { type: object } }
        accessToken:
          type: string
          description: Credencial para X-Order-Access (ver orderAccess). Guardarla para ver y pagar el pedido.

    CreateServiceRequest:
      type: object
      required: [service, name, email, message, privacyAccepted]
      properties:
        service:
          type: string
          enum: [armado, diseno, personalizacion, instituciones, regalos, garantia]
        name: { type: string, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        phone:
          type: [string, "null"]
          description: 9 dígitos, con o sin +56; se guarda "+56XXXXXXXXX".
        commune: { type: [string, "null"], maxLength: 60 }
        childrenAges: { type: [string, "null"], maxLength: 60, example: 3 y 6 años }
        preferredDate:
          type: [string, "null"]
          format: date
          description: Desde hoy (día de Chile) en adelante.
        message: { type: string, minLength: 10, maxLength: 2000 }
        privacyAccepted:
          {
            const: true,
            description: Acepta la política de privacidad (fecha y versión se guardan),
          }
    CreateOrder:
      type: object
      required: [buyer, delivery, billing, expectedTotal, termsAccepted]
      properties:
        buyer:
          type: object
          required: [name, rut, email, phone]
          properties:
            name: { type: string, maxLength: 120 }
            rut:
              {
                type: string,
                description: Con o sin puntos y guion; se valida el dígito verificador,
              }
            email: { type: string, format: email }
            phone: { type: string, description: 9 dígitos, con o sin +56 }
        delivery:
          oneOf:
            - type: object
              required: [method]
              properties: { method: { const: retiro } }
            - type: object
              required: [method, region, commune, street]
              properties:
                method: { const: despacho }
                region:
                  { type: string, pattern: "^[A-Z]{2}$", description: Código de región (AR, RM…) }
                commune: { type: string, maxLength: 80 }
                street: { type: string, maxLength: 160 }
                unit: { type: [string, "null"], maxLength: 60 }
                notes: { type: [string, "null"], maxLength: 300 }
        billing:
          oneOf:
            - type: object
              required: [document]
              properties: { document: { const: boleta } }
            - type: object
              required: [document, rut, businessName, activity, email, address, commune]
              properties:
                document: { const: factura }
                rut: { type: string }
                businessName: { type: string, maxLength: 160 }
                activity: { type: string, maxLength: 120 }
                email: { type: string, format: email }
                address: { type: string, maxLength: 160 }
                commune: { type: string, maxLength: 60 }
                purchaseOrder: { type: boolean, default: false }
        expectedTotal:
          type: integer
          minimum: 0
          description: |
            Total en CLP que vio y confirmó el comprador (`totals.total` de GET
            /shipping/quote con la misma entrega). El carrito no guarda precios: si
            el total de hoy es otro, 409 `total_changed` y no se crea el pedido (RN-02).
        termsAccepted:
          { const: true, description: Acepta condiciones de compra, despacho y privacidad (RNF-13) }
    AddCartItemInput:
      type: object
      required: [sku, quantity]
      properties:
        sku: { type: string, maxLength: 60 }
        quantity: { type: integer, minimum: 1, maximum: 9 }
        extras:
          type: array
          maxItems: 10
          description: Códigos de los extras elegidos.
          items: { type: string, maxLength: 40 }
        texts:
          type: object
          description: Texto de cada extra personalizable, por código.
          additionalProperties: { type: string, maxLength: 200 }
    UpdateCartItemInput:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1, maximum: 9 }
    ApplyCouponInput:
      type: object
      required: [code]
      properties:
        code: { type: string, maxLength: 60 }
    ShippingQuote:
      type: object
      required: [method, cost, reason, leadTime, pickupDetails, zone, freeShipping, message, totals]
      properties:
        method: { type: string, enum: [despacho, retiro] }
        cost:
          type: [integer, "null"]
          description: CLP; null = por confirmar o a coordinar (no se suma).
        reason: { type: string, enum: [pickup, threshold, zone, pending_rate, coordinate] }
        leadTime: { type: [string, "null"] }
        pickupDetails: { type: [string, "null"] }
        zone:
          oneOf:
            - type: object
              required: [region, commune]
              properties:
                region: { type: string }
                commune: { type: string }
            - { type: "null" }
        freeShipping:
          oneOf:
            - type: object
              required: [threshold, remaining, reached]
              properties:
                threshold: { type: integer }
                remaining: { type: integer }
                reached: { type: boolean }
            - { type: "null" }
        message: { type: [string, "null"] }
        totals:
          type: object
          required: [subtotal, discount, shipping, total]
          properties:
            subtotal: { type: integer }
            discount: { type: integer }
            shipping: { type: [integer, "null"] }
            total:
              type: integer
              description: subtotal − descuento + despacho (un despacho null no suma).
    # ── Panel: pedidos (LN-13) ──
    OrderStatus:
      type: string
      enum:
        [pending_payment, in_review, confirmed, preparing, shipped, delivered, cancelled, expired]
    OrderPaymentStatus:
      type: string
      description: Estado del último intento de pago; `none` si nunca se intentó.
      enum: [pending, paid, rejected, voided, in_review, expired, none]
    AdminOrderSummary:
      type: object
      required:
        [
          id,
          number,
          ref,
          createdAt,
          buyerName,
          buyerEmail,
          status,
          statusLabel,
          paymentStatus,
          paymentLabel,
          deliveryMethod,
          taxDocument,
          invoicePending,
          shippingCost,
          total,
        ]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        ref: { type: string, example: TK-1048 }
        createdAt: { type: string, format: date-time }
        buyerName: { type: string }
        buyerEmail: { type: string, format: email }
        status: { $ref: "#/components/schemas/OrderStatus" }
        statusLabel: { type: string, example: Confirmado }
        paymentStatus: { $ref: "#/components/schemas/OrderPaymentStatus" }
        paymentLabel: { type: string, example: Pagado }
        deliveryMethod: { type: string, enum: [shipping, pickup] }
        taxDocument: { type: string, enum: [boleta, factura] }
        invoicePending: { type: boolean }
        shippingCost: { type: [integer, "null"], description: null = despacho a coordinar. }
        total: { type: integer }
    AdminRefundRecord:
      type: object
      required:
        [
          id,
          paymentId,
          amount,
          date,
          reference,
          status,
          statusLabel,
          registeredBy,
          registeredByName,
          registeredAt,
          resolvedBy,
          resolvedByName,
          resolvedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        amount: { type: integer, minimum: 1 }
        date: { type: string, format: date }
        reference: { type: string }
        status: { type: string, enum: [requested, processed, failed] }
        statusLabel: { type: string }
        registeredBy: { type: string, description: Rol de quien lo registró. }
        registeredByName: { type: [string, "null"] }
        registeredAt: { type: string, format: date-time }
        resolvedBy: { type: [string, "null"] }
        resolvedByName: { type: [string, "null"] }
        resolvedAt: { type: [string, "null"], format: date-time }
    RefundTotals:
      type: object
      required: [charged, committed, processed, refundable, state]
      properties:
        charged: { type: integer, description: Monto del pago confirmado. }
        committed: { type: integer, description: Solicitados + procesados (cuentan para el tope). }
        processed: { type: integer }
        refundable: { type: integer, description: Lo que aún se puede registrar. }
        state: { type: string, enum: [not_requested, requested, processed, failed] }
    RefundRecordInput:
      type: object
      additionalProperties: false
      required: [amount, date, reference, status]
      properties:
        amount: { type: integer, minimum: 1, description: CLP entero. }
        date: { type: string, format: date, description: Día de Chile (AAAA-MM-DD). }
        reference: { type: string, minLength: 3, maxLength: 120 }
        status: { type: string, enum: [requested, processed] }
    RefundResult:
      type: object
      required: [refund, refundTotals]
      properties:
        refund: { $ref: "#/components/schemas/AdminRefundRecord" }
        refundTotals: { $ref: "#/components/schemas/RefundTotals" }
    InvoiceResult:
      type: object
      required: [invoice, previousNumber, invoicePending]
      properties:
        invoice:
          type: object
          required: [number, issuedAt, issuedBy, issuedByName]
          properties:
            number: { type: string, pattern: "^\\d{1,10}$" }
            issuedAt: { type: string, format: date-time }
            issuedBy: { type: string }
            issuedByName: { type: [string, "null"] }
        previousNumber:
          type: [string, "null"]
          description: Folio anterior cuando se corrigió; null al registrar el primero.
        invoicePending: { type: boolean, enum: [false] }
    OrderStatusChangeInput:
      type: object
      additionalProperties: false
      required: [to, reason]
      properties:
        to: { $ref: "#/components/schemas/OrderStatus" }
        reason: { type: string, minLength: 3, maxLength: 500 }
        carrier:
          type: string
          maxLength: 80
          description: Obligatorio al despachar a domicilio.
        code:
          type: string
          maxLength: 80
          description: Código de seguimiento; obligatorio al despachar a domicilio.
        restock:
          type: boolean
          default: false
          description: Registrar la reposición al cancelar un pedido pagado (RN-06).
    AdminOrderDetail:
      type: object
      required:
        [
          id,
          number,
          ref,
          status,
          statusLabel,
          buyer,
          delivery,
          billing,
          items,
          amounts,
          payment,
          payments,
          refunds,
          refundTotals,
          statusHistory,
          activity,
          emails,
          canRecordRestock,
          availableTransitions,
          blockedByUnresolvedPayment,
        ]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        ref: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/OrderStatus" }
        statusLabel: { type: string }
        buyer:
          type: object
          required: [name, rut, email, phone]
          properties:
            name: { type: string }
            rut: { type: string }
            email: { type: string }
            phone: { type: string }
        delivery:
          type: object
          properties:
            method: { type: string, enum: [shipping, pickup] }
            region: { type: [string, "null"] }
            commune: { type: [string, "null"] }
            street: { type: [string, "null"] }
            unit: { type: [string, "null"] }
            notes: { type: [string, "null"] }
            leadTime: { type: [string, "null"] }
            pickupDetails: { type: [string, "null"] }
            carrier: { type: [string, "null"] }
            trackingCode: { type: [string, "null"] }
        billing:
          type: object
          properties:
            document: { type: string, enum: [boleta, factura] }
            rut: { type: [string, "null"] }
            businessName: { type: [string, "null"] }
            activity: { type: [string, "null"] }
            email: { type: [string, "null"] }
            address: { type: [string, "null"] }
            commune: { type: [string, "null"] }
            purchaseOrderRequired: { type: boolean }
            invoice:
              oneOf:
                - type: object
                  required: [number, issuedAt, issuedBy, issuedByName]
                  properties:
                    number: { type: string }
                    issuedAt: { type: string, format: date-time }
                    issuedBy: { type: string }
                    issuedByName: { type: [string, "null"] }
                - { type: "null" }
            invoicePending: { type: boolean }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              variantId: { type: [string, "null"], format: uuid }
              productName: { type: string }
              sku: { type: string }
              optionLabel: { type: [string, "null"] }
              quantity: { type: integer }
              unitPrice: { type: integer }
              extrasUnitPrice: { type: integer }
              lineTotal: { type: integer }
              madeToOrder:
                type: boolean
                description: Al menos parte de la línea se fabrica a pedido (UI-11).
              leadTime: { type: [string, "null"] }
              extras:
                type: array
                items:
                  type: object
                  properties:
                    code: { type: string }
                    name: { type: string }
                    unitPrice: { type: [integer, "null"] }
                    text: { type: [string, "null"] }
        amounts:
          type: object
          properties:
            currency: { type: string }
            subtotal: { type: integer }
            discount: { type: integer }
            shippingCost: { type: [integer, "null"] }
            total: { type: integer }
            couponCode: { type: [string, "null"] }
        payment:
          type: object
          properties:
            status: { $ref: "#/components/schemas/OrderPaymentStatus" }
            label: { type: string }
            paymentDueAt: { type: string, format: date-time }
            paidAt: { type: [string, "null"], format: date-time }
        payments:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              attempt: { type: integer }
              commerceOrder: { type: string }
              flowOrder: { type: [string, "null"] }
              status: { type: string }
              label: { type: string }
              amount: { type: integer }
              paymentMethod: { type: [string, "null"] }
              paidAt: { type: [string, "null"], format: date-time }
              lastCheckedAt: { type: [string, "null"], format: date-time }
              createdAt: { type: string, format: date-time }
        refunds: { type: array, items: { $ref: "#/components/schemas/AdminRefundRecord" } }
        refundTotals: { $ref: "#/components/schemas/RefundTotals" }
        statusHistory:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              from: { oneOf: [{ $ref: "#/components/schemas/OrderStatus" }, { type: "null" }] }
              to: { $ref: "#/components/schemas/OrderStatus" }
              toLabel: { type: string }
              actorLabel: { type: string }
              actorName: { type: [string, "null"] }
              reason: { type: [string, "null"] }
              at: { type: string, format: date-time }
        activity:
          type: array
          description: |
            audit_log del pedido: `order.status_changed`, `order.restock_recorded`,
            `order.refund_recorded`, `order.refund_resolved`,
            `order.invoice_registered`, `order.invoice_replaced`.
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              action: { type: string }
              actorLabel: { type: string }
              actorName: { type: [string, "null"] }
              reason: { type: [string, "null"] }
              details: { type: object }
              at: { type: string, format: date-time }
        emails:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              event: { type: string }
              recipient: { type: string }
              status: { type: string }
              resendOfId: { type: [string, "null"], format: uuid }
              createdAt: { type: string, format: date-time }
              updatedAt: { type: string, format: date-time }
        cancelledAt: { type: [string, "null"], format: date-time }
        restockRecordedAt: { type: [string, "null"], format: date-time }
        canRecordRestock: { type: boolean }
        availableTransitions: { type: array, items: { $ref: "#/components/schemas/OrderStatus" } }
        blockedByUnresolvedPayment: { type: boolean }

    # ── Panel: configuración, solicitudes, reportes, usuarios y lecturas (LN-16) ──
    AdminCoupon:
      type: object
      required:
        [
          id,
          code,
          kind,
          value,
          startsOn,
          endsOn,
          maxUses,
          uses,
          reservedUses,
          consumedUses,
          active,
          status,
          statusLabel,
          termsLocked,
          canDelete,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: APRENDER10 }
        kind: { type: string, enum: [percent, amount] }
        value: { type: integer, description: Porcentaje (1–100) o monto en CLP }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        maxUses: { type: integer, minimum: 1 }
        uses:
          { type: integer, minimum: 0, description: Reservados + consumidos (cuentan para el cupo) }
        reservedUses: { type: integer, minimum: 0 }
        consumedUses: { type: integer, minimum: 0 }
        active: { type: boolean }
        status: { type: string, enum: [active, scheduled, expired, exhausted, inactive] }
        statusLabel: { type: string, example: Activo }
        termsLocked: { type: boolean, description: Con usos, código, tipo y valor quedan fijos }
        canDelete: { type: boolean, description: Sin usos, canjes ni pedidos que lo citen }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminCouponInput:
      type: object
      additionalProperties: false
      required: [code, kind, value, startsOn, endsOn, maxUses]
      properties:
        code:
          {
            type: string,
            minLength: 3,
            maxLength: 20,
            description: "Se quitan los espacios y se pasa a mayúsculas; A–Z, 0–9, - y _",
          }
        kind: { type: string, enum: [percent, amount] }
        value:
          { type: integer, minimum: 1, description: "Porcentaje 1–100 o monto CLP 1–10.000.000" }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        maxUses: { type: integer, minimum: 1, maximum: 1000000 }
        active: { type: boolean, default: true }
    AdminCouponUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Campos parciales de AdminCouponInput.
      properties:
        code: { type: string, minLength: 3, maxLength: 20 }
        kind: { type: string, enum: [percent, amount] }
        value: { type: integer, minimum: 1 }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        maxUses: { type: integer, minimum: 1, maximum: 1000000 }
        active: { type: boolean }
    AdminBanner:
      type: object
      required:
        [
          id,
          title,
          text,
          href,
          sortOrder,
          active,
          startsAt,
          endsAt,
          visibility,
          visibilityLabel,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        text: { type: string }
        href: { type: string, example: /catalogo?categoria=junji }
        sortOrder: { type: integer, minimum: 1, maximum: 99 }
        active: { type: boolean }
        startsAt: { type: [string, "null"], format: date-time }
        endsAt: { type: [string, "null"], format: date-time }
        visibility: { type: string, enum: [visible, scheduled, ended, inactive] }
        visibilityLabel: { type: string, example: Visible }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminBannerInput:
      type: object
      additionalProperties: false
      required: [title, text, href, sortOrder]
      properties:
        title: { type: string, minLength: 1, maxLength: 60 }
        text: { type: string, minLength: 1, maxLength: 140 }
        href:
          {
            type: string,
            maxLength: 200,
            pattern: "^/(?!/)",
            description: Ruta interna de la tienda,
          }
        sortOrder: { type: integer, minimum: 1, maximum: 99 }
        active: { type: boolean, default: true }
        startsAt: { type: [string, "null"], format: date-time }
        endsAt: { type: [string, "null"], format: date-time }
    AdminBannerUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Campos parciales de AdminBannerInput.
      properties:
        title: { type: string, minLength: 1, maxLength: 60 }
        text: { type: string, minLength: 1, maxLength: 140 }
        href: { type: string, maxLength: 200 }
        sortOrder: { type: integer, minimum: 1, maximum: 99 }
        active: { type: boolean }
        startsAt: { type: [string, "null"], format: date-time }
        endsAt: { type: [string, "null"], format: date-time }
    PublicBanner:
      type: object
      required: [id, title, text, href, sortOrder]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        text: { type: string }
        href: { type: string }
        sortOrder: { type: integer }
    AdminShippingZone:
      type: object
      required:
        [id, region, commune, price, leadTime, freeShippingEligible, active, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        region: { type: string, example: RM }
        commune: { type: string, example: Ñuñoa }
        price:
          {
            type: [integer, "null"],
            minimum: 0,
            description: "CLP; 0 = sin costo; null = por confirmar",
          }
        leadTime: { type: string }
        freeShippingEligible: { type: boolean }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminShippingZoneInput:
      type: object
      additionalProperties: false
      required: [region, commune, price, leadTime]
      properties:
        region:
          type: string
          enum: [AP, TA, AN, AT, CO, VS, RM, LI, ML, NB, BI, AR, LR, LL, AI, MA]
        commune: { type: string, minLength: 1, maxLength: 80 }
        price: { type: [integer, "null"], minimum: 0, maximum: 1000000 }
        leadTime: { type: string, minLength: 1, maxLength: 60 }
        freeShippingEligible: { type: boolean, default: true }
        active: { type: boolean, default: true }
    AdminShippingZoneUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Campos parciales de AdminShippingZoneInput.
      properties:
        region: { type: string }
        commune: { type: string, minLength: 1, maxLength: 80 }
        price: { type: [integer, "null"], minimum: 0, maximum: 1000000 }
        leadTime: { type: string, minLength: 1, maxLength: 60 }
        freeShippingEligible: { type: boolean }
        active: { type: boolean }
    ShippingSettings:
      type: object
      required: [pickupEnabled, pickupDetails, freeShippingThreshold, reservationMinutes, updatedAt]
      properties:
        pickupEnabled: { type: boolean }
        pickupDetails: { type: string }
        freeShippingThreshold: { type: [integer, "null"], minimum: 0 }
        reservationMinutes: { type: integer, minimum: 1, maximum: 120 }
        updatedAt: { type: [string, "null"], format: date-time }
    ShippingSettingsInput:
      type: object
      additionalProperties: false
      required: [pickupEnabled, pickupDetails, freeShippingThreshold, reservationMinutes]
      properties:
        pickupEnabled: { type: boolean }
        pickupDetails: { type: string, minLength: 1, maxLength: 200 }
        freeShippingThreshold: { type: [integer, "null"], minimum: 0, maximum: 100000000 }
        reservationMinutes: { type: integer, minimum: 1, maximum: 120 }
    StoreThemeId:
      type: string
      enum: [clasica, navidad, pascua, ano-nuevo, fiestas-patrias, invierno, primavera]
    AdminStoreTheme:
      type: object
      required: [theme, themes, updatedAt]
      properties:
        theme: { $ref: "#/components/schemas/StoreThemeId" }
        themes: { type: array, items: { $ref: "#/components/schemas/StoreThemeId" } }
        updatedAt: { type: [string, "null"], format: date-time }
    ServiceRequestStatus:
      type: string
      enum: [new, in_progress, resolved]
    AdminServiceRequestSummary:
      type: object
      required:
        [
          id,
          number,
          reference,
          service,
          serviceLabel,
          name,
          email,
          commune,
          preferredDate,
          status,
          statusLabel,
          hasNote,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        reference: { type: string, example: SOL-1002 }
        service: { type: string, example: armado }
        serviceLabel: { type: string, example: Armado e instalación }
        name: { type: string }
        email: { type: string, format: email }
        commune: { type: [string, "null"] }
        preferredDate: { type: [string, "null"], format: date }
        status: { $ref: "#/components/schemas/ServiceRequestStatus" }
        statusLabel: { type: string, example: Nueva }
        hasNote: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminServiceRequestDetail:
      allOf:
        - $ref: "#/components/schemas/AdminServiceRequestSummary"
        - type: object
          required:
            [
              phone,
              childrenAges,
              message,
              privacyAcceptedAt,
              privacyVersion,
              note,
              statusOptions,
              history,
              emails,
            ]
          properties:
            phone: { type: [string, "null"] }
            childrenAges: { type: [string, "null"] }
            message: { type: string }
            privacyAcceptedAt: { type: string, format: date-time }
            privacyVersion: { type: string }
            note: { type: string, description: Nota interna (solo el equipo) }
            statusOptions:
              type: array
              items: { $ref: "#/components/schemas/ServiceRequestStatus" }
              description: El estado actual primero y luego los permitidos
            history:
              type: array
              items:
                type: object
                required: [at, actor, actorName, actorUserId, change]
                properties:
                  at: { type: string, format: date-time }
                  actor: { type: string, description: Rol o «Solicitante» }
                  actorName: { type: [string, "null"] }
                  actorUserId: { type: [string, "null"], format: uuid }
                  change: { type: string, example: "Estado: Nueva → En gestión" }
            emails:
              type: array
              items:
                type: object
                required: [id, event, recipient, status, resendOfId, createdAt]
                properties:
                  id: { type: string, format: uuid }
                  event: { $ref: "#/components/schemas/EmailEvent" }
                  recipient: { type: string }
                  status: { $ref: "#/components/schemas/EmailStatus" }
                  resendOfId: { type: [string, "null"], format: uuid }
                  createdAt: { type: string, format: date-time }
    ServiceRequestFollowUpInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status: { $ref: "#/components/schemas/ServiceRequestStatus" }
        note: { type: string, maxLength: 1000, description: '"" borra la nota' }
    AdminSubscriber:
      type: object
      required:
        [
          id,
          email,
          status,
          statusLabel,
          consentedAt,
          consentVersion,
          unsubscribedAt,
          unsubscribedBy,
        ]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        status: { type: string, enum: [active, unsubscribed] }
        statusLabel: { type: string, example: Activo }
        consentedAt: { type: string, format: date-time }
        consentVersion: { type: string }
        unsubscribedAt: { type: [string, "null"], format: date-time }
        unsubscribedBy:
          { type: [string, "null"], description: «Suscriptor» o el rol que la registró }
    SalesReport:
      type: object
      required:
        [
          period,
          currency,
          timeZone,
          criteria,
          charged,
          refunded,
          net,
          paidOrders,
          averageTicket,
          refundsCount,
          sales,
          byProduct,
          byMethod,
          refunds,
        ]
      properties:
        period:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        currency: { type: string, enum: [CLP] }
        timeZone: { type: string, enum: [America/Santiago] }
        criteria: { type: string, description: Criterio de fecha para mostrar en la pantalla }
        charged: { type: integer, description: Cobros confirmados del período }
        refunded: { type: integer, description: Reembolsos procesados con fecha en el período }
        net: { type: integer }
        paidOrders: { type: integer }
        averageTicket: { type: integer }
        refundsCount: { type: integer }
        sales:
          type: array
          items:
            type: object
            required: [orderId, orderRef, buyerName, method, paidAt, charged, refundedInPeriod]
            properties:
              orderId: { type: string, format: uuid }
              orderRef: { type: string, example: TK-1048 }
              buyerName: { type: string }
              method: { type: string, example: Flow }
              paidAt: { type: string, format: date-time }
              charged: { type: integer }
              refundedInPeriod: { type: integer }
        byProduct:
          type: array
          items:
            type: object
            required: [name, sku, units, amount]
            properties:
              name: { type: string }
              sku: { type: string }
              units: { type: integer }
              amount: { type: integer, description: Al precio de compra, antes del descuento }
        byMethod:
          type: array
          items:
            type: object
            required: [method, orders, charged, refunded]
            properties:
              method: { type: string }
              orders: { type: integer }
              charged: { type: integer }
              refunded: { type: integer }
        refunds:
          type: array
          items:
            type: object
            required: [id, orderId, orderRef, date, amount, method, reference]
            properties:
              id: { type: string, format: uuid }
              orderId: { type: string, format: uuid }
              orderRef: { type: string }
              date: { type: string, format: date }
              amount: { type: integer }
              method: { type: string }
              reference: { type: string }
    PanelSummary:
      type: object
      required: [byStatus, paymentsInReview, paymentsPending, recentOrders, sales, lowStockVariants]
      properties:
        byStatus:
          type: object
          description: Pedidos por estado
          additionalProperties: { type: integer }
        paymentsInReview: { type: integer }
        paymentsPending: { type: integer }
        recentOrders: { type: array, items: { $ref: "#/components/schemas/AdminOrderSummary" } }
        sales:
          description: Solo Administrador (null para el Operador). Mes en curso.
          oneOf:
            - type: "null"
            - type: object
              required: [period, charged, refunded, net]
              properties:
                period:
                  type: object
                  properties:
                    from: { type: string, format: date }
                    to: { type: string, format: date }
                charged: { type: integer }
                refunded: { type: integer }
                net: { type: integer }
        lowStockVariants:
          type: [integer, "null"]
          description: Solo Administrador. Variantes activas con 1 a 3 unidades disponibles.
    AdminPayment:
      type: object
      required:
        [
          id,
          orderId,
          orderRef,
          buyerName,
          attempt,
          commerceOrder,
          flowOrder,
          amount,
          status,
          statusLabel,
          paymentMethod,
          createdAt,
          paidAt,
          lastCheckedAt,
          current,
          reconcilable,
        ]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        orderRef: { type: string, example: TK-1053 }
        buyerName: { type: string }
        attempt: { type: integer }
        commerceOrder: { type: string }
        flowOrder: { type: [string, "null"] }
        amount: { type: integer }
        status: { type: string, enum: [pending, paid, rejected, voided, in_review, expired] }
        statusLabel: { type: string }
        paymentMethod: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        paidAt: { type: [string, "null"], format: date-time }
        lastCheckedAt: { type: [string, "null"], format: date-time }
        current: { type: boolean, description: Último intento del pedido }
        reconcilable: { type: boolean, description: Último intento pendiente o en revisión (LN-15) }
    ActivityArea:
      type: string
      enum:
        [
          pedidos,
          pagos,
          reembolsos,
          inventario,
          catalogo,
          configuracion,
          solicitudes,
          correos,
          suscriptores,
          usuarios,
          exportaciones,
        ]
    ActivityPage:
      type: object
      required: [items, meta, actors, byArea]
      properties:
        items:
          type: array
          items:
            type: object
            required:
              [
                id,
                at,
                area,
                areaLabel,
                action,
                description,
                reason,
                actorUserId,
                actorName,
                actorLabel,
                resourceType,
                resourceId,
                reference,
                requestId,
              ]
            properties:
              id: { type: string, format: uuid }
              at: { type: string, format: date-time }
              area: { oneOf: [{ $ref: "#/components/schemas/ActivityArea" }, { type: "null" }] }
              areaLabel: { type: [string, "null"] }
              action: { type: string, example: order.status_changed }
              description:
                { type: string, example: "Estado del pedido: Confirmado → En preparación" }
              reason: { type: [string, "null"] }
              actorUserId: { type: [string, "null"], format: uuid }
              actorName: { type: [string, "null"], description: Nombre de la persona }
              actorLabel: { type: string, description: Rol con que actuó }
              resourceType: { type: string }
              resourceId: { type: string }
              reference:
                oneOf:
                  - type: "null"
                  - type: object
                    required: [type, id, label]
                    properties:
                      type: { type: string, example: order }
                      id: { type: string }
                      label: { type: string, example: TK-1048 }
              requestId: { type: [string, "null"] }
        meta: { $ref: "#/components/schemas/PageMeta" }
        actors:
          type: array
          items:
            type: object
            required: [id, name, role, active]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              role: { type: string, example: Operador }
              active: { type: boolean }
        byArea:
          type: object
          additionalProperties: { type: integer }
    AdminUser:
      type: object
      required:
        [
          id,
          name,
          email,
          role,
          roleLabel,
          status,
          active,
          lastLoginAt,
          createdAt,
          updatedAt,
          isSelf,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, operator] }
        roleLabel: { type: string, example: Administrador }
        status: { type: string, enum: [active, inactive] }
        active: { type: boolean }
        lastLoginAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        isSelf: { type: boolean, description: Es la cuenta de quien consulta }
    AdminUserInput:
      type: object
      additionalProperties: false
      required: [name, email, role]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        role: { type: string, enum: [admin, operator] }
        active: { type: boolean, default: true }
    AdminUserUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        role: { type: string, enum: [admin, operator] }
        active: { type: boolean }
    AdminUserCreated:
      allOf:
        - $ref: "#/components/schemas/AdminUser"
        - type: object
          required: [invitationSent]
          properties:
            invitationSent:
              { type: boolean, description: Se encoló el correo para definir la contraseña }
    AdminUserChanged:
      allOf:
        - $ref: "#/components/schemas/AdminUser"
        - type: object
          required: [sessionsRevoked]
          properties:
            sessionsRevoked: { type: integer, minimum: 0, description: Sesiones revocadas (RNF-01) }
    EmailEvent:
      type: string
      enum:
        [
          order_received,
          purchase_confirmed,
          new_sale,
          payment_rejected,
          order_shipped,
          order_delivered,
          service_request,
          password_recovery,
          newsletter_unsubscribe,
        ]
    EmailStatus:
      type: string
      enum: [pending, sent, failed, uncertain]
    AdminEmailSummary:
      type: object
      required:
        [
          id,
          event,
          eventLabel,
          recipient,
          status,
          statusLabel,
          reference,
          attemptsCount,
          lastAttemptAt,
          resendOfId,
          canResend,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        event: { $ref: "#/components/schemas/EmailEvent" }
        eventLabel: { type: string, example: Pedido despachado }
        recipient: { type: string }
        status: { $ref: "#/components/schemas/EmailStatus" }
        statusLabel: { type: string, example: Fallido }
        reference:
          oneOf:
            - type: "null"
            - type: object
              required: [kind, id, label]
              properties:
                kind: { type: string, enum: [order, request] }
                id: { type: string, format: uuid }
                label: { type: string, example: TK-1048 }
        attemptsCount: { type: integer }
        lastAttemptAt: { type: [string, "null"], format: date-time }
        resendOfId: { type: [string, "null"], format: uuid }
        canResend: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminEmailDetail:
      allOf:
        - $ref: "#/components/schemas/AdminEmailSummary"
        - type: object
          required: [eventKey, providerMessageId, attempts, resends]
          properties:
            eventKey: { type: string }
            providerMessageId: { type: [string, "null"] }
            attempts:
              type: array
              items:
                type: object
                required:
                  [id, at, kind, result, resultLabel, actorUserId, actorLabel, actorName, detail]
                properties:
                  id: { type: string, format: uuid }
                  at: { type: string, format: date-time }
                  kind: { type: string, enum: [automatic, manual] }
                  result: { type: string, enum: [sent, failed, timeout] }
                  resultLabel: { type: string }
                  actorUserId: { type: [string, "null"], format: uuid }
                  actorLabel: { type: [string, "null"] }
                  actorName: { type: [string, "null"] }
                  detail: { type: [string, "null"] }
            resends:
              type: array
              items:
                type: object
                required: [id, status, createdAt]
                properties:
                  id: { type: string, format: uuid }
                  status: { $ref: "#/components/schemas/EmailStatus" }
                  createdAt: { type: string, format: date-time }
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string }
    OrderRef:
      name: id
      in: path
      required: true
      description: Uuid del pedido o su número visible ("TK-1048" o "1048").
      schema: { type: string, example: TK-1048 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Clave única por intento de creación (UUID v4 recomendado). Repetir la misma
        clave con el mismo cuerpo devuelve el mismo resultado; con otro cuerpo, 409.
      schema: { type: string, minLength: 16, maxLength: 128 }
    CsrfTokenHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: Mismo valor que la cookie tk_csrf (ver GET /csrf).
      schema: { $ref: "#/components/schemas/CsrfToken" }

  requestBodies:
    PendingJson:
      description: Cuerpo JSON; el esquema se define en la tarea LN indicada.
      required: true
      content:
        application/json:
          schema: { type: object }
    FlowCallback:
      description: Formulario que envía Flow (solo `token`; no confiable hasta consultar a Flow).
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required: [token]
            properties:
              token: { type: string }

  headers:
    RateLimit:
      description: 'Cupo restante de la política (draft-8), p. ej. `"global"; r=12; t=240`.'
      schema: { type: string }
    RateLimitPolicy:
      description: 'Política aplicada (draft-8), p. ej. `"global"; q=300; w=300`.'
      schema: { type: string }
    RetryAfter:
      description: Segundos hasta poder reintentar.
      schema: { type: integer }

  responses:
    BadRequest:
      description: Solicitud inválida (p. ej. JSON malformado)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
          example:
            {
              code: BAD_REQUEST,
              message: El cuerpo de la solicitud no es JSON válido,
              details: null,
              requestId: 3f0a9c1e,
            }
    Unauthorized:
      description: No autenticado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
          example:
            {
              code: UNAUTHORIZED,
              message: Debes iniciar sesión,
              details: null,
              requestId: 3f0a9c1e,
            }
    Forbidden:
      description: Sin permiso para la acción, o verificación CSRF fallida (CSRF_FAILED)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
          examples:
            forbidden:
              value:
                {
                  code: FORBIDDEN,
                  message: No tienes permiso para esta acción,
                  details: null,
                  requestId: 3f0a9c1e,
                }
            csrf:
              value:
                {
                  code: CSRF_FAILED,
                  message: Falta el token de seguridad del formulario,
                  details: null,
                  requestId: 3f0a9c1e,
                }
    NotFound:
      description: Recurso o ruta inexistente
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
          example:
            { code: NOT_FOUND, message: Recurso no encontrado, details: null, requestId: 3f0a9c1e }
    MethodNotAllowed:
      description: Método no permitido en la ruta
      headers:
        Allow: { schema: { type: string }, description: "Métodos admitidos, p. ej. `GET, HEAD`" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
          example:
            {
              code: METHOD_NOT_ALLOWED,
              message: Método DELETE no permitido en esta ruta,
              details: { allowed: [GET, HEAD] },
              requestId: 3f0a9c1e,
            }
    Conflict:
      description: Conflicto con el estado actual (duplicado, transición inválida, clave de idempotencia reutilizada)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
          example:
            {
              code: CONFLICT,
              message: El recurso cambió o ya existe,
              details: null,
              requestId: 3f0a9c1e,
            }
    PayloadTooLarge:
      description: Cuerpo demasiado grande (JSON 100 KB; formularios de Flow 16 KB; imágenes 2 MB)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
          example:
            {
              code: PAYLOAD_TOO_LARGE,
              message: El cuerpo de la solicitud es demasiado grande,
              details: null,
              requestId: 3f0a9c1e,
            }
    UnsupportedMediaType:
      description: Content-Type no permitido (solo JSON; formularios solo en callbacks de Flow; multipart solo en la subida de imágenes)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
          example:
            {
              code: UNSUPPORTED_MEDIA_TYPE,
              message: El cuerpo debe enviarse como application/json,
              details: { allowed: [application/json] },
              requestId: 3f0a9c1e,
            }
    ValidationFailed:
      description: Los datos no pasan la validación (un issue por campo)
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorBody"
              - type: object
                properties:
                  details:
                    type: object
                    required: [issues]
                    properties:
                      issues:
                        type: array
                        items: { $ref: "#/components/schemas/ValidationIssue" }
          example:
            code: VALIDATION_ERROR
            message: Los datos enviados no son válidos
            details:
              issues:
                - { location: body, path: email, message: Inválido dirección de correo electrónico }
            requestId: 3f0a9c1e
    TooManyRequests:
      description: Límite de peticiones superado
      headers:
        RateLimit: { $ref: "#/components/headers/RateLimit" }
        RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
          example:
            {
              code: RATE_LIMITED,
              message: "Demasiadas solicitudes, intenta más tarde",
              details: { retryAfterSeconds: 240 },
              requestId: 3f0a9c1e,
            }
    InternalError:
      description: Fallo interno, sin trazas ni datos sensibles
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
          example:
            {
              code: INTERNAL_ERROR,
              message: Error interno del servidor,
              details: null,
              requestId: 3f0a9c1e,
            }

  securitySchemes:
    panelSession:
      type: apiKey
      in: cookie
      name: tk_panel
      description: |
        Sesión opaca del panel (Administrador u Operador): `tk_panel`, o
        `__Host-tk_panel` en producción. HttpOnly, SameSite=Lax y Secure en
        producción (RNF-01). En la base solo se guarda su hash. Vence a las 12 h
        o tras 2 h sin uso; se revoca al cerrar sesión o restablecer la contraseña.
    cartSession:
      type: apiKey
      in: cookie
      name: tk_carrito
      description: |
        Sesión opaca de carrito del invitado (LN-06): `tk_carrito`, o
        `__Host-tk_carrito` en producción. HttpOnly, SameSite=Lax y Secure en
        producción. Solo un token aleatorio (en la base, su hash); no contiene
        líneas ni precios. Vence tras `CART_TTL_DAYS` sin uso (30 por defecto).
    orderAccess:
      type: apiKey
      in: header
      name: X-Order-Access
      description: |
        Credencial no adivinable y de acceso limitado a un pedido de invitado
        (RF-36), entregada al crearlo y por POST /orders/lookup. Es un HMAC-SHA256
        del pedido con una clave del servidor (43 caracteres base64url): no se guarda
        en la base y deja de servir si se rota el secreto de la API.
    csrfCookie:
      type: apiKey
      in: cookie
      name: tk_csrf
      description: |
        Cookie del doble envío CSRF (`__Host-tk_csrf` en producción). Se envía junto
        con la cabecera X-CSRF-Token en todo método que modifica.
