openapi: 3.1.0
info:
  title: Total Kids API
  version: 0.1.0
  description: |
    API interna de la tienda online Total Kids (mobiliario infantil), SRS 4.4.2.

    - Base `/api/v1`. El navegador nunca la llama directo: Next.js (BFF) intermedia
      y la autorización se verifica siempre aquí.
    - Operaciones en JSON. Solo los callbacks de Flow aceptan formularios.
    - Errores con el formato `ErrorBody` y el catálogo de códigos de abajo.
    - Métodos que modifican (POST/PUT/PATCH/DELETE) exigen CSRF de doble envío:
      cookie `tk_csrf` (`__Host-tk_csrf` en producción) y cabecera `X-CSRF-Token`
      con el mismo valor, obtenidos de `GET /csrf`. Exentos: callbacks de Flow.
    - Límites: global por IP (`RateLimit`, `RateLimit-Policy`, `Retry-After`) y más
      estrictos en formularios públicos y login.

    Alcance acordado con el cliente (aún no está en la SRS): compras solo como
    invitado (sin registro, recuperación ni `/me/orders`; el comprador consulta su
    pedido con número y correo), productos a pedido con reserva salvo stock cargado,
    despacho a coordinar o retiro en taller, factura emitida por Total Kids con folio
    y boleta con el comprobante de Flow.

    Las operaciones marcadas `[Pendiente LN-xx]` (extensión `x-pending-task`) son el
    contrato previsto: aún no existen y responden 404 (las de `/admin`, 401 sin
    sesión del panel, porque todo `/admin` exige sesión). Sus cuerpos se definen en
    la tarea indicada. `x-roles` indica los roles del panel que pueden usarlas: sin
    el rol, 403.

    Códigos de error: BAD_REQUEST (400), UNAUTHORIZED (401), FORBIDDEN (403),
    CSRF_FAILED (403), NOT_FOUND (404), METHOD_NOT_ALLOWED (405), CONFLICT (409),
    PAYLOAD_TOO_LARGE (413), UNSUPPORTED_MEDIA_TYPE (415), VALIDATION_ERROR (422),
    RATE_LIMITED (429), INTERNAL_ERROR (500), DATABASE_UNAVAILABLE (503).
servers:
  - url: http://localhost:4000/api/v1
    description: Desarrollo local
tags:
  - name: Sistema
  - name: Catálogo
  - name: Carrito
  - name: Pedidos
  - name: Pagos
  - name: Panel - Sesión
  - name: Formularios
  - name: Panel - Catálogo
  - name: Panel - Pedidos
  - name: Panel - Configuración
  - name: Panel - Solicitudes y newsletter
  - name: Panel - Reportes
  - name: Panel - Usuarios
  - name: Panel - Correos

paths:
  # ───────────────────────── Sistema (implementado) ─────────────────────────
  /health:
    get:
      operationId: getHealth
      summary: Estado de la API y de la conexión a la base de datos
      tags: [Sistema]
      security: []
      responses:
        "200":
          description: API operativa y base de datos accesible
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: Base de datos no disponible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
              example:
                code: DATABASE_UNAVAILABLE
                message: No hay conexión con la base de datos
                details:
                  cause: PrismaClientKnownRequestError
                requestId: 3f0a9c1e-2b7d-4c55-9a3e-1d2f6b8e9a10

  /csrf:
    get:
      operationId: getCsrfToken
      summary: Token CSRF para los formularios (doble envío firmado)
      description: |
        Devuelve el token y lo fija en la cookie `tk_csrf` (HttpOnly, SameSite=Lax,
        Path=/; en producción `__Host-tk_csrf` con Secure). Next.js reenvía el
        `Set-Cookie` al navegador, pinta el token en un campo oculto del formulario
        y lo manda en `X-CSRF-Token` al enviar. Si la cookie actual sigue siendo
        válida para la sesión, se devuelve la misma. El token está atado a la
        sesión (panel o carrito): tras iniciar sesión hay que pedir uno nuevo.
      tags: [Sistema]
      security: []
      responses:
        "200":
          description: Token emitido o reutilizado
          headers:
            Set-Cookie:
              description: "`tk_csrf=<token>; Path=/; HttpOnly; SameSite=Lax` (+ Secure en producción)"
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [csrfToken]
                properties:
                  csrfToken: { $ref: "#/components/schemas/CsrfToken" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ───────────────────────── Catálogo público (LN-05) ─────────────────────────
  /products:
    get:
      operationId: listProducts
      summary: "[Pendiente LN-05] Catálogo de productos activos"
      description: |
        Paginado y filtrable por categoría. Cada producto indica su disponibilidad:
        `en_stock` si hay unidades cargadas en el inventario, o `a_pedido` (se
        fabrica a pedido y se compra como reserva).
      x-pending-task: LN-05
      tags: [Catálogo]
      security: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - { name: category, in: query, schema: { type: string }, description: Slug de categoría }
      responses:
        "200":
          description: Página de productos (esquema en LN-05)
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items: { type: array, items: { type: object } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /products/{slug}:
    get:
      operationId: getProduct
      summary: "[Pendiente LN-05] Ficha de producto"
      x-pending-task: LN-05
      tags: [Catálogo]
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Ficha con variantes y disponibilidad (esquema en LN-05) }
        "404": { $ref: "#/components/responses/NotFound" }
  /categories:
    get:
      operationId: listCategories
      summary: "[Pendiente LN-05] Categorías activas"
      x-pending-task: LN-05
      tags: [Catálogo]
      security: []
      responses:
        "200": { description: Lista de categorías (esquema en LN-05) }

  # ───────────────────────── Carrito (LN-06) ─────────────────────────
  /cart:
    get:
      operationId: getCart
      summary: "[Pendiente LN-06] Carrito propio"
      description: |
        Solo sesión opaca de invitado (no hay cuentas de comprador). Precios y
        totales calculados en el servidor (RNF-03). Las líneas sin stock se marcan
        "a pedido" y no bloquean la compra.
      x-pending-task: LN-06
      tags: [Carrito]
      security: [{ cartSession: [] }]
      responses:
        "200": { description: Carrito con líneas y totales (esquema en LN-06) }
  /cart/items:
    post:
      operationId: addCartItem
      summary: "[Pendiente LN-06] Agregar una variante al carrito"
      description: Crea la sesión opaca de carrito si no existe.
      x-pending-task: LN-06
      tags: [Carrito]
      security: [{ cartSession: [], csrfCookie: [] }, { csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody: { $ref: "#/components/requestBodies/PendingJson" }
      responses:
        "201": { description: Carrito actualizado }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /cart/items/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - $ref: "#/components/parameters/CsrfTokenHeader"
    patch:
      operationId: updateCartItem
      summary: "[Pendiente LN-06] Cambiar la cantidad de una línea"
      x-pending-task: LN-06
      tags: [Carrito]
      security: [{ cartSession: [], csrfCookie: [] }]
      requestBody: { $ref: "#/components/requestBodies/PendingJson" }
      responses:
        "200": { description: Carrito actualizado }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      operationId: deleteCartItem
      summary: "[Pendiente LN-06] Quitar una línea"
      x-pending-task: LN-06
      tags: [Carrito]
      security: [{ cartSession: [], csrfCookie: [] }]
      responses:
        "200": { description: Carrito actualizado }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /cart/coupon:
    parameters:
      - $ref: "#/components/parameters/CsrfTokenHeader"
    post:
      operationId: applyCartCoupon
      summary: "[Pendiente LN-06] Aplicar un cupón"
      x-pending-task: LN-06
      tags: [Carrito]
      security: [{ cartSession: [], csrfCookie: [] }]
      requestBody: { $ref: "#/components/requestBodies/PendingJson" }
      responses:
        "200": { description: Carrito con descuento }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      operationId: removeCartCoupon
      summary: "[Pendiente LN-06] Quitar el cupón"
      x-pending-task: LN-06
      tags: [Carrito]
      security: [{ cartSession: [], csrfCookie: [] }]
      responses:
        "200": { description: Carrito sin cupón }
        "403": { $ref: "#/components/responses/Forbidden" }
  /shipping/quote:
    get:
      operationId: quoteShipping
      summary: "[Pendiente LN-06] Costo de entrega del carrito"
      description: |
        Cambio del cliente: no hay despacho a todo Chile. `retiro` (en taller) es
        siempre gratis. `despacho` (a coordinar) es gratis desde el umbral
        configurado; si no, la tarifa depende de la zona y puede venir `cost: null`
        ("por confirmar"), que no se suma al total (RF-08, RF-11).
      x-pending-task: LN-06
      tags: [Carrito]
      security: [{ cartSession: [] }]
      parameters:
        - {
            name: method,
            in: query,
            required: true,
            schema: { type: string, enum: [despacho, retiro] },
          }
        - { name: region, in: query, schema: { type: string } }
        - { name: commune, in: query, schema: { type: string } }
      responses:
        "200":
          description: Cotización
          content:
            application/json:
              schema:
                type: object
                required: [method, cost]
                properties:
                  method: { type: string, enum: [despacho, retiro] }
                  cost:
                    type: [integer, "null"]
                    description: CLP; null = por confirmar
                  reason: { type: string, enum: [pickup, threshold, zone] }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # ───────────────────────── Pedidos de invitado (LN-09) ─────────────────────────
  /orders:
    post:
      operationId: createOrder
      summary: "[Pendiente LN-09] Crear el pedido desde el carrito"
      description: |
        Compra como invitado con el correo del checkout. Reserva stock, incluso de
        productos a pedido. `document` es `boleta` (el comprobante de Flow la
        reemplaza) o `factura` (la emite Total Kids con folio tras el pago).
        Entrega `retiro` o `despacho`. Totales calculados en el servidor (RNF-03).
      x-pending-task: LN-09
      tags: [Pedidos]
      security: [{ cartSession: [], csrfCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfTokenHeader"
      requestBody: { $ref: "#/components/requestBodies/PendingJson" }
      responses:
        "201": { description: Pedido creado en pendiente_pago con su credencial de acceso }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /orders/lookup:
    post:
      operationId: lookupGuestOrder
      summary: "[Pendiente LN-09] Consultar un pedido con número y correo"
      description: |
        Reemplaza a `/me/orders` (no hay cuentas de comprador). Va por POST para que
        el correo no quede en URLs ni logs. Responde el mismo 404 genérico si el
        número no existe o el correo no coincide, para no revelar pedidos (RF-36).
        Límite estricto por IP. Entrega la credencial `orderAccess` del pedido.
      x-pending-task: LN-09
      tags: [Pedidos]
      security: [{ csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderNumber, email]
              properties:
                orderNumber: { type: string, example: TK-1048 }
                email: { type: string, format: email }
      responses:
        "200": { description: Resumen del pedido y credencial de acceso (esquema en LN-09) }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /orders/{orderNumber}:
    get:
      operationId: getGuestOrder
      summary: "[Pendiente LN-09] Detalle y seguimiento de un pedido"
      description: Solo con la credencial específica del pedido (RF-36). Sin sesión de cliente.
      x-pending-task: LN-09
      tags: [Pedidos]
      security: [{ orderAccess: [] }]
      parameters:
        - {
            name: orderNumber,
            in: path,
            required: true,
            schema: { type: string, example: TK-1048 },
          }
      responses:
        "200": { description: Pedido (esquema en LN-09) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────── Pagos Flow (LN-10) ─────────────────────────
  /payments/flow/create:
    post:
      operationId: createFlowPayment
      summary: "[Pendiente LN-10] Crear o recuperar el intento de pago vigente"
      x-pending-task: LN-10
      tags: [Pagos]
      security: [{ orderAccess: [], csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody: { $ref: "#/components/requestBodies/PendingJson" }
      responses:
        "200": { description: URL de pago de Flow (url + token) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /payments/flow/confirm:
    post:
      operationId: confirmFlowPayment
      summary: "[Pendiente LN-10] Callback de confirmación de Flow"
      description: |
        Público y exento de CSRF. El token no es confiable hasta consultar a Flow
        (`getStatus`) con credenciales del backend y verificar pedido, moneda y
        monto (RF-16). Idempotente (RF-19). Responde éxito solo tras registrar el
        callback de forma durable.
      x-pending-task: LN-10
      tags: [Pagos]
      security: []
      requestBody: { $ref: "#/components/requestBodies/FlowCallback" }
      responses:
        "200": { description: Callback registrado }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/InternalError" }
  /payments/flow/return:
    post:
      operationId: returnFromFlow
      summary: "[Pendiente LN-10] Retorno del comprador desde Flow"
      description: |
        Público y exento de CSRF de sesión, pero sin autoridad para acreditar pagos
        (RNF-04): volver del proveedor no confirma nada. Consulta el estado de forma
        segura y redirige al resultado en la tienda.
      x-pending-task: LN-10
      tags: [Pagos]
      security: []
      requestBody: { $ref: "#/components/requestBodies/FlowCallback" }
      responses:
        "303":
          description: Redirección a la página de resultado de la tienda
          headers:
            Location: { schema: { type: string } }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  # ───────────────────────── Sesión del panel (LN-04, implementado) ─────────────────────────
  /auth/login:
    post:
      operationId: panelLogin
      summary: Ingreso al panel (Administrador u Operador)
      description: |
        Solo para el equipo del taller: no hay cuentas de comprador. Correo
        inexistente, contraseña errónea y cuenta inactiva responden igual (401).
        Abre siempre una sesión nueva y revoca la que traiga la cookie.

        Cookie `tk_panel` (`__Host-tk_panel` en producción): HttpOnly, SameSite=Lax,
        Secure en producción. Vence a las 12 h o tras 2 h sin uso (RNF-01). Como
        el token CSRF está atado a la sesión, después de ingresar hay que pedir
        `GET /csrf` de nuevo.

        Límites (RNF-04): 5 fallos por cuenta cada 15 min (aunque después acierte)
        y 20 intentos por IP cada 15 min.
      tags: [Panel - Sesión]
      security: [{ csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, format: password, minLength: 1, maxLength: 1024 }
            example: { email: admin@totalkids.cl, password: "••••••••••••" }
      responses:
        "204":
          description: Sesión iniciada
          headers:
            Set-Cookie:
              description: "`tk_panel=<token>; Max-Age=43200; Path=/; HttpOnly; SameSite=Lax` (+ Secure)"
              schema: { type: string }
        "401":
          description: Credenciales inválidas (mismo mensaje en todos los casos)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
              example:
                {
                  code: UNAUTHORIZED,
                  message: Correo o contraseña incorrectos,
                  details: null,
                  requestId: 3f0a9c1e,
                }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/logout:
    post:
      operationId: panelLogout
      summary: Cerrar sesión del panel
      description: Revoca la sesión en la base y borra la cookie. Idempotente (204 aunque no haya sesión).
      tags: [Panel - Sesión]
      security: [{ panelSession: [], csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      responses:
        "204": { description: Sesión revocada y cookie borrada }
        "403": { $ref: "#/components/responses/Forbidden" }
  /auth/session:
    get:
      operationId: getPanelSession
      summary: Usuario y rol de la sesión del panel
      description: |
        El rol y el estado de la cuenta se leen en cada petición: un cambio de rol
        o una desactivación rigen de inmediato.
      x-roles: [admin, operator]
      tags: [Panel - Sesión]
      security: [{ panelSession: [] }]
      responses:
        "200":
          description: Sesión vigente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanelSession" }
              example:
                user:
                  {
                    id: 01a204a0-3284-71e8-a591-c7d2602639e9,
                    email: admin@totalkids.cl,
                    name: Ana,
                    role: admin,
                  }
                expiresAt: "2026-12-04T22:00:00.000Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/password-reset/request:
    post:
      operationId: requestPanelPasswordReset
      summary: Pedir un enlace para restablecer la contraseña (equipo del panel)
      description: |
        Responde 202 exista o no la cuenta (no revela qué correos existen). Si es
        una cuenta activa, encola el correo en outbox; el worker de LN-14 emite el
        token de un solo uso (30 min) al enviarlo. El token no se guarda en claro.
        Límites: 5 pedidos por IP cada 15 min y 3 por cuenta cada hora.
      tags: [Panel - Sesión]
      security: [{ csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
            example: { email: admin@totalkids.cl }
      responses:
        "202": { description: Pedido recibido }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/password-reset/confirm:
    post:
      operationId: confirmPanelPasswordReset
      summary: Restablecer la contraseña con el token del enlace
      description: |
        El token es de un solo uso, vence a los 30 minutos y solo vale el último
        enviado. Al usarlo se revocan todas las sesiones de la cuenta (RNF-01).
        Un token inválido, usado o vencido responde 422 con el issue en `token`.
        Límite: 10 intentos por IP cada 15 min.
      tags: [Panel - Sesión]
      security: [{ csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
                password: { type: string, format: password, minLength: 12, maxLength: 128 }
      responses:
        "204": { description: Contraseña cambiada y sesiones revocadas }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ───────────────────────── Formularios públicos (LN-08) ─────────────────────────
  /service-requests:
    post:
      operationId: createServiceRequest
      summary: "[Pendiente LN-08] Solicitud de armado, diseño, personalización, etc."
      description: Público con validación y límite por IP (10 cada 15 min). Devuelve la referencia.
      x-pending-task: LN-08
      tags: [Formularios]
      security: [{ csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody: { $ref: "#/components/requestBodies/PendingJson" }
      responses:
        "201": { description: "Solicitud registrada: { reference }" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /newsletter:
    post:
      operationId: subscribeNewsletter
      summary: "[Pendiente LN-08] Suscripción con consentimiento explícito"
      description: Registra fecha y versión del texto de consentimiento (RF-25). Límite por IP.
      x-pending-task: LN-08
      tags: [Formularios]
      security: [{ csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody: { $ref: "#/components/requestBodies/PendingJson" }
