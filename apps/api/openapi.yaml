openapi: 3.1.0
info:
  title: Total Kids API
  version: 0.1.0
  description: |
    API interna de la tienda online Total Kids (mobiliario infantil), SRS 4.4.2.

    - Base `/api/v1`. El navegador nunca la llama directo: Next.js (BFF) intermedia
      y la autorización se verifica siempre aquí.
    - Operaciones en JSON. Solo los callbacks de Flow aceptan formularios y solo la
      subida de imágenes del panel acepta multipart/form-data (máximo 2 MB).
    - Errores con el formato `ErrorBody` y el catálogo de códigos de abajo.
    - Métodos que modifican (POST/PUT/PATCH/DELETE) exigen CSRF de doble envío:
      cookie `tk_csrf` (`__Host-tk_csrf` en producción) y cabecera `X-CSRF-Token`
      con el mismo valor, obtenidos de `GET /csrf`. Exentos: callbacks de Flow.
    - Límites: global por IP (`RateLimit`, `RateLimit-Policy`, `Retry-After`) y más
      estrictos en formularios públicos y login.

    Alcance acordado con el cliente (aún no está en la SRS): compras solo como
    invitado (sin registro, recuperación ni `/me/orders`; el comprador consulta su
    pedido con número y correo), productos a pedido con reserva salvo stock cargado,
    despacho a coordinar o retiro en taller, factura emitida por Total Kids con folio
    y boleta con el comprobante de Flow.

    Las operaciones marcadas `[Pendiente LN-xx]` (extensión `x-pending-task`) son el
    contrato previsto: aún no existen y responden 404 (las de `/admin`, 401 sin
    sesión del panel, porque todo `/admin` exige sesión). Sus cuerpos se definen en
    la tarea indicada. `x-roles` indica los roles del panel que pueden usarlas: sin
    el rol, 403.

    Códigos de error: BAD_REQUEST (400), UNAUTHORIZED (401), FORBIDDEN (403),
    CSRF_FAILED (403), NOT_FOUND (404), METHOD_NOT_ALLOWED (405), CONFLICT (409),
    PAYLOAD_TOO_LARGE (413), UNSUPPORTED_MEDIA_TYPE (415), VALIDATION_ERROR (422),
    RATE_LIMITED (429), INTERNAL_ERROR (500), DATABASE_UNAVAILABLE (503).
servers:
  - url: http://localhost:4000/api/v1
    description: Desarrollo local
tags:
  - name: Sistema
  - name: Catálogo
  - name: Carrito
  - name: Pedidos
  - name: Pagos
  - name: Panel - Sesión
  - name: Formularios
  - name: Tienda
  - name: Panel - Catálogo
  - name: Panel - Pedidos
  - name: Panel - Resumen
  - name: Panel - Pagos
  - name: Panel - Configuración
  - name: Panel - Solicitudes y newsletter
  - name: Panel - Reportes
  - name: Panel - Usuarios
  - name: Panel - Correos

paths:
  # ───────────────────────── Sistema (implementado) ─────────────────────────
  /health:
    get:
      operationId: getHealth
      summary: Estado de la API y de la conexión a la base de datos
      tags: [Sistema]
      security: []
      responses:
        "200":
          description: API operativa y base de datos accesible
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: Base de datos no disponible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
              example:
                code: DATABASE_UNAVAILABLE
                message: No hay conexión con la base de datos
                details:
                  cause: PrismaClientKnownRequestError
                requestId: 3f0a9c1e-2b7d-4c55-9a3e-1d2f6b8e9a10

  /csrf:
    get:
      operationId: getCsrfToken
      summary: Token CSRF para los formularios (doble envío firmado)
      description: |
        Devuelve el token y lo fija en la cookie `tk_csrf` (HttpOnly, SameSite=Lax,
        Path=/; en producción `__Host-tk_csrf` con Secure). Next.js reenvía el
        `Set-Cookie` al navegador, pinta el token en un campo oculto del formulario
        y lo manda en `X-CSRF-Token` al enviar. Si la cookie actual sigue siendo
        válida para la sesión, se devuelve la misma. El token está atado a la
        sesión (panel o carrito): tras iniciar sesión hay que pedir uno nuevo.
      tags: [Sistema]
      security: []
      responses:
        "200":
          description: Token emitido o reutilizado
          headers:
            Set-Cookie:
              description: "`tk_csrf=<token>; Path=/; HttpOnly; SameSite=Lax` (+ Secure en producción)"
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [csrfToken]
                properties:
                  csrfToken: { $ref: "#/components/schemas/CsrfToken" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ───────────────────────── Catálogo público (LN-05, implementado) ─────────────────────────
  /products:
    get:
      operationId: listProducts
      summary: Catálogo de productos visibles, con búsqueda, filtros y orden
      description: |
        Visibles: productos activos y publicados, de categorías activas y con al
        menos una variante activa. `price` es el menor precio entre las variantes
        (null si aún no tiene). `availability` es `en_stock` si alguna variante
        tiene unidades cargadas en el inventario, o `a_pedido` (se fabrica a pedido
        y se compra como reserva).

        Búsqueda (`q`): sin tildes ni mayúsculas; todas las palabras (máx. 8) deben
        aparecer en el nombre, el resumen, la descripción, la categoría o una
        categoría adicional activa. `color` coincide si alguna variante activa
        tiene ese color (sin tildes ni mayúsculas). Los filtros de lista
        aceptan el parámetro repetido o separado por comas y coinciden con
        cualquiera de los valores. Un filtro de precio excluye los productos sin
        precio. `best_selling` ordena por unidades de pedidos con pago confirmado,
        luego destacados y luego novedades.
      tags: [Catálogo]
      security: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: q
          in: query
          description: Texto a buscar (sin tildes ni mayúsculas)
          schema: { type: string, maxLength: 100 }
          example: baul madera
        - name: category
          in: query
          description: Slug de categoría
          schema: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
        - name: ageGroup
          in: query
          description: Nivel o edad (`sala-cuna`, `nivel-medio`, `transicion`, `adultos`). Repetible.
          style: form
          explode: true
          schema: { type: array, maxItems: 10, items: { type: string } }
        - name: material
          in: query
          description: Material (`madera`, `melamina`, `plastico`, `metal`). Repetible.
          style: form
          explode: true
          schema: { type: array, maxItems: 10, items: { type: string } }
        - name: color
          in: query
          description: Color de alguna variante activa (`Blanco`, `azul marino`), sin tildes ni mayúsculas. Repetible.
          style: form
          explode: true
          schema: { type: array, maxItems: 10, items: { type: string, maxLength: 60 } }
        - { name: priceMin, in: query, schema: { type: integer, minimum: 0 } }
        - name: priceMax
          in: query
          description: Debe ser mayor o igual a priceMin
          schema: { type: integer, minimum: 0 }
        - name: onSale
          in: query
          description: Solo productos con precio anterior (en oferta)
          schema: { type: boolean }
        - name: featured
          in: query
          description: Solo productos destacados (portada)
          schema: { type: boolean }
        - name: availability
          in: query
          schema: { type: string, enum: [en_stock, a_pedido] }
        - name: sort
          in: query
          schema:
            type: string
            enum: [best_selling, price_asc, price_desc, newest]
            default: best_selling
      responses:
        "200":
          description: Página de productos
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ProductSummary" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
              example:
                items:
                  - slug: cuna-coigue-junji
                    name: Cuna coigüe JUNJI
                    summary: Cuna de madera nativa
                    category: { slug: cunas, name: Cunas y camas }
                    ageGroups: [sala-cuna]
                    materials: [madera]
                    price: 199990
                    compareAtPrice: null
                    onSale: false
                    featured: true
                    availability: a_pedido
                    publishedAt: "2026-03-01T00:00:00.000Z"
                    image:
                      {
                        url: /productos/cuna-coigue-junji/1.webp,
                        alt: Cuna coigüe,
                        width: 800,
                        height: 800,
                      }
                meta: { page: 1, pageSize: 20, total: 12, totalPages: 1 }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /products/{slug}:
    get:
      operationId: getProduct
      summary: Ficha de producto
      description: |
        Variantes activas con sus unidades disponibles (físico − reservado; 0 = a
        pedido), todas las fotos (la principal primero, con la variante que
        ilustran) y solo los extras disponibles. 404 si no existe o no está visible.
      tags: [Catálogo]
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: Ficha del producto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /categories:
    get:
      operationId: listCategories
      summary: Categorías activas
      description: En el orden definido en el panel, con la cantidad de productos visibles.
      tags: [Catálogo]
      security: []
      responses:
        "200":
          description: Lista de categorías
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Category" } }
              example:
                items:
                  - { slug: cunas, name: Cunas y camas, description: null, productCount: 11 }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ───────────────────────── Carrito (LN-06) ─────────────────────────
  /cart:
    get:
      operationId: getCart
      summary: Carrito propio con precios, avisos y totales calculados en el servidor
      description: |
        Solo sesión opaca de invitado (no hay cuentas de comprador). Sin cookie, o
        con un carrito vencido, responde un carrito vacío y **no crea filas**.
        Revalida en cada lectura (RF-06): precio actual de variante y extras,
        productos o variantes inactivos (`status: unavailable`, fuera de los
        totales), precio por definir (`unpriced`, bloquea el pago), extras
        retirados y cupón que dejó de valer, con su aviso. Leer no borra nada: la
        siguiente escritura del carrito los limpia. Stock 0 no es «agotado»: la
        línea se vende a pedido con su plazo. Extiende la vida del carrito
        (`CART_TTL_DAYS`) y renueva la cookie como mucho una vez por hora.
      tags: [Carrito]
      security: [{ cartSession: [] }, {}]
      responses:
        "200":
          description: Carrito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
  /cart/items:
    post:
      operationId: addCartItem
      summary: Agregar una variante al carrito
      description: |
        Crea la sesión opaca de carrito si no existe (`Set-Cookie: tk_carrito`,
        HttpOnly, SameSite=Lax; `__Host-tk_carrito` y Secure en producción). Al
        crearla cambia la clave de sesión del CSRF, así que la misma respuesta trae
        un token nuevo en `Set-Cookie: tk_csrf` y en la cabecera `X-CSRF-Token`
        (Next.js lo usa en el siguiente formulario sin pedir `/csrf`).

        Variante activa de un producto visible (404 si no). Los extras deben estar
        ofrecidos por el producto; los que piden texto lo exigen con su largo
        máximo efectivo. La misma combinación SKU + extras + textos (normalizados)
        suma cantidad; otra combinación es otra línea. Máximo 9 unidades por SKU
        y 30 líneas (422). Agregar NO reserva stock (RN-04).
      tags: [Carrito]
      security: [{ cartSession: [], csrfCookie: [] }, { csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddCartItemInput" }
      responses:
        "201":
          description: Carrito actualizado
          headers:
            X-CSRF-Token:
              description: Solo al crear el carrito; token CSRF atado a la nueva sesión.
              schema: { $ref: "#/components/schemas/CsrfToken" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /cart/items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Id de la línea (`CartLine.id`). Una línea de otro carrito responde 404.
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/CsrfTokenHeader"
    patch:
      operationId: updateCartItem
      summary: Cambiar la cantidad de una línea (1 a 9)
      description: Para quitarla se usa DELETE. Responde el carrito con los avisos de la limpieza.
      tags: [Carrito]
      security: [{ cartSession: [], csrfCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCartItemInput" }
      responses:
        "200":
          description: Carrito actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      operationId: deleteCartItem
      summary: Quitar una línea
      tags: [Carrito]
      security: [{ cartSession: [], csrfCookie: [] }]
      responses:
        "200":
          description: Carrito actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /cart/coupon:
    parameters:
      - $ref: "#/components/parameters/CsrfTokenHeader"
    post:
      operationId: applyCartCoupon
      summary: Aplicar un cupón (reemplaza al anterior)
      description: |
        Uno por carrito (no se acumulan, RN-01). El código se normaliza (mayúsculas,
        sin espacios). Debe estar activo, vigente hoy en días de Chile (ambos
        extremos inclusive) y con cupo (`usesCount < maxUses`). El descuento se
        calcula solo sobre el subtotal elegible (productos y extras, nunca el
        despacho); el porcentaje se redondea al peso y nunca supera ese subtotal.
        **No reserva usos**: eso ocurre al crear el pedido (LN-09).

        Rechazos (422, `details.reason`): `empty` («Escribe el código de tu
        cupón.»), `not_found`, `inactive`, `not_started`, `expired`, `exhausted`
        (todos «El cupón «X» no existe o ya no está vigente.») y `empty_cart`
        («Agrega productos antes de aplicar un cupón.»). Sin carrito no crea filas.
      tags: [Carrito]
      security: [{ cartSession: [], csrfCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplyCouponInput" }
      responses:
        "200":
          description: Carrito con descuento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      operationId: removeCartCoupon
      summary: Quitar el cupón
      tags: [Carrito]
      security: [{ cartSession: [], csrfCookie: [] }]
      responses:
        "200":
          description: Carrito sin cupón
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /shipping/quote:
    get:
      operationId: quoteShipping
      summary: Costo de entrega del carrito
      description: |
        Cambio del cliente: no hay despacho a todo Chile. `retiro` (en taller) es
        siempre gratis (422 si está deshabilitado). `despacho` (a coordinar) exige
        `region` y `commune` (la comuna se compara sin tildes ni mayúsculas):
        - zona activa y elegible con el umbral alcanzado → `cost: 0`, `threshold`;
        - zona con tarifa → `cost`, `zone`;
        - zona sin tarifa → `cost: null`, `pending_rate` («por confirmar»);
        - comuna sin zona activa → `cost: null`, `coordinate` («a coordinar»).

        El umbral se calcula sobre subtotal elegible − descuento del carrito
        (RF-08) y solo en zonas habilitadas y elegibles. El descuento nunca se
        aplica al despacho, y un `cost: null` no se suma al total (RF-11). La
        cotización sale del puerto `ShippingQuoter` (hoy, zonas del panel).
      tags: [Carrito]
      security: [{ cartSession: [] }, {}]
      parameters:
        - name: method
          in: query
          required: true
          schema: { type: string, enum: [despacho, retiro] }
        - name: region
          in: query
          description: Código de región ("RM"). Obligatorio con despacho.
          schema: { type: string, maxLength: 4 }
        - name: commune
          in: query
          description: Comuna. Obligatoria con despacho.
          schema: { type: string, maxLength: 80 }
      responses:
        "200":
          description: Cotización
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShippingQuote" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # ───────────────────────── Pedidos de invitado (LN-09) ─────────────────────────
  /orders:
    post:
      operationId: createOrder
      summary: Crear el pedido desde el carrito
      description: |
        Compra como invitado con el correo del checkout. En una sola transacción,
        con el carrito bloqueado: revalida el carrito, el cupón y el despacho;
        guarda una foto de comprador, entrega, factura, líneas e importes (RN-02);
        reserva atómicamente las unidades terminadas (RN-03, RN-04) y lo que falta
        queda `madeToOrder` con su plazo (UI-11); reserva el uso del cupón; registra
        el historial y encola el correo "pedido recibido". Totales calculados en el
        servidor (RNF-03). `document` es `boleta` (el comprobante de Flow la
        reemplaza) o `factura` (la emite Total Kids con folio tras el pago).

        Idempotente (RF-13): repetir la misma `Idempotency-Key` con el mismo cuerpo
        responde 200 con el mismo pedido; con otro cuerpo, 409. El carrito se
        conserva hasta que el pago se confirme (LN-10).
      tags: [Pedidos]
      security: [{ cartSession: [], csrfCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrder" }
            example:
              buyer:
                {
                  name: María González,
                  rut: 12.345.678-5,
                  email: maria@correo.cl,
                  phone: "+56 9 1234 5678",
                }
              delivery: { method: retiro }
              billing: { document: boleta }
              expectedTotal: 50000
              termsAccepted: true
      responses:
        "200":
          description: Reintento con la misma Idempotency-Key y el mismo cuerpo (mismo pedido)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedOrder" }
        "201":
          description: Pedido creado en pending_payment con su credencial de acceso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedOrder" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: |
            No se creó el pedido. `details.reason`: `empty_cart`; `cart_blocked`
            (un producto ya no se vende), `coupon_invalid` (el cupón dejó de valer) o
            `cart_changed` (extra retirado o cantidad ajustada), con los avisos en
            `details.notices` (revisar GET /cart antes de pagar); `cart_unpriced`
            (un producto quedó sin precio); `coupon_exhausted` (otra
            compra se llevó el último uso); `total_changed` (el total de hoy no es
            `expectedTotal`; `details.totals` trae el vigente); `pickup_disabled`; `idempotency_mismatch`
            o `in_progress`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /orders/lookup:
    post:
      operationId: lookupGuestOrder
      summary: Consultar un pedido con número y correo
      description: |
        Reemplaza a `/me/orders` (no hay cuentas de comprador). Va por POST para que
        el correo no quede en URLs ni logs. Responde el mismo 404 genérico si el
        número no existe o el correo no coincide, para no revelar pedidos (RF-36).
        Límite por IP: 10 consultas cada 15 minutos. Entrega el pedido y la
        credencial `orderAccess` (la misma que se entregó al crearlo). El número
        acepta "TK-1048", "tk-1048" o "1048"; el correo no distingue mayúsculas.
      tags: [Pedidos]
      security: [{ csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderNumber, email]
              properties:
                orderNumber: { type: string, example: TK-1048 }
                email: { type: string, format: email }
      responses:
        "200":
          description: Pedido y credencial de acceso
          content:
            application/json:
              schema:
                type: object
                required: [order, accessToken]
                properties:
                  order: { $ref: "#/components/schemas/GuestOrder" }
                  accessToken: { type: string, description: Credencial para X-Order-Access }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /orders/{orderNumber}:
    get:
      operationId: getGuestOrder
      summary: Detalle y seguimiento de un pedido
      description: |
        Solo con la credencial específica del pedido en `X-Order-Access` (RF-36).
        Sin credencial, 401; con una que no corresponde a ese pedido (o un número
        inexistente), el mismo 404. El historial muestra estados y fechas, sin
        actores ni notas internas.
      tags: [Pedidos]
      security: [{ orderAccess: [] }]
      parameters:
        - {
            name: orderNumber,
            in: path,
            required: true,
            schema: { type: string, example: TK-1048 },
          }
      responses:
        "200":
          description: Pedido con su seguimiento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestOrder" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────── Pagos Flow (LN-10) ─────────────────────────
  /payments/flow/create:
    post:
      operationId: createFlowPayment
      summary: Crear o recuperar el intento de pago vigente
      description: |
        Con la credencial del pedido. Reutiliza el intento vigente (RF-15) y no abre
        otro mientras el anterior pueda cobrarse (RN-06): primero consulta su estado
        a Flow. Tras un rechazo vuelve a reservar el stock liberado.
        `details.reason` del 409: `payment_uncertain`, `already_paid`,
        `order_not_payable`, `payment_expired`, `nothing_to_charge`,
        `stock_unavailable` o `payment_unavailable`.
      tags: [Pagos]
      security: [{ orderAccess: [], csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderNumber]
              properties:
                orderNumber: { type: string, example: TK-1048 }
      responses:
        "200":
          description: URL de pago de Flow (url + token)
          content:
            application/json:
              schema:
                type: object
                required: [redirectUrl]
                properties:
                  redirectUrl: { type: string, format: uri }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "409": { $ref: "#/components/responses/Conflict" }
  /payments/flow/confirm:
    post:
      operationId: confirmFlowPayment
      summary: Callback de confirmación de Flow
      description: |
        Público y exento de CSRF. El token no es confiable hasta consultar a Flow
        (`getStatus`) con credenciales del backend y verificar pedido, moneda y
        monto (RF-16). Idempotente (RF-19). Responde éxito solo tras registrar el
        callback de forma durable. Con el pago confirmado se elimina el carrito del
        que salió el pedido (LN-11).
      tags: [Pagos]
      security: []
      requestBody: { $ref: "#/components/requestBodies/FlowCallback" }
      responses:
        "200": { description: Callback registrado }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
  /payments/flow/return:
    post:
      operationId: returnFromFlow
      summary: Retorno del comprador desde Flow
      description: |
        Público y exento de CSRF de sesión, pero sin autoridad para acreditar pagos
        (RNF-04): volver del proveedor no confirma nada. Consulta el estado de forma
        segura y redirige a `/checkout/resultado?pedido=TK-…` (sin estado en la URL).
      tags: [Pagos]
      security: []
      requestBody: { $ref: "#/components/requestBodies/FlowCallback" }
      responses:
        "303":
          description: Redirección a la página de resultado de la tienda
          headers:
            Location: { schema: { type: string } }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  # ───────────────────────── Sesión del panel (LN-04, implementado) ─────────────────────────
  /auth/login:
    post:
      operationId: panelLogin
      summary: Ingreso al panel (Administrador u Operador)
      description: |
        Solo para el equipo del taller: no hay cuentas de comprador. Correo
        inexistente, contraseña errónea y cuenta inactiva responden igual (401).
        Abre siempre una sesión nueva y revoca la que traiga la cookie.

        Cookie `tk_panel` (`__Host-tk_panel` en producción): HttpOnly, SameSite=Lax,
        Secure en producción. Vence a las 12 h o tras 2 h sin uso (RNF-01). Como
        el token CSRF está atado a la sesión, después de ingresar hay que pedir
        `GET /csrf` de nuevo.

        Límites (RNF-04): 5 fallos por cuenta cada 15 min (aunque después acierte)
        y 20 intentos por IP cada 15 min.
      tags: [Panel - Sesión]
      security: [{ csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, format: password, minLength: 1, maxLength: 1024 }
            example: { email: admin@totalkids.cl, password: "••••••••••••" }
      responses:
        "204":
          description: Sesión iniciada
          headers:
            Set-Cookie:
              description: "`tk_panel=<token>; Max-Age=43200; Path=/; HttpOnly; SameSite=Lax` (+ Secure)"
              schema: { type: string }
        "401":
          description: Credenciales inválidas (mismo mensaje en todos los casos)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
              example:
                {
                  code: UNAUTHORIZED,
                  message: Correo o contraseña incorrectos,
                  details: null,
                  requestId: 3f0a9c1e,
                }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/logout:
    post:
      operationId: panelLogout
      summary: Cerrar sesión del panel
      description: Revoca la sesión en la base y borra la cookie. Idempotente (204 aunque no haya sesión).
      tags: [Panel - Sesión]
      security: [{ panelSession: [], csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      responses:
        "204": { description: Sesión revocada y cookie borrada }
        "403": { $ref: "#/components/responses/Forbidden" }
  /auth/session:
    get:
      operationId: getPanelSession
      summary: Usuario y rol de la sesión del panel
      description: |
        El rol y el estado de la cuenta se leen en cada petición: un cambio de rol
        o una desactivación rigen de inmediato.
      x-roles: [admin, operator]
      tags: [Panel - Sesión]
      security: [{ panelSession: [] }]
      responses:
        "200":
          description: Sesión vigente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanelSession" }
              example:
                user:
                  {
                    id: 01a204a0-3284-71e8-a591-c7d2602639e9,
                    email: admin@totalkids.cl,
                    name: Ana,
                    role: admin,
                  }
                expiresAt: "2026-12-04T22:00:00.000Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/password-reset/request:
    post:
      operationId: requestPanelPasswordReset
      summary: Pedir un enlace para restablecer la contraseña (equipo del panel)
      description: |
        Responde 202 exista o no la cuenta (no revela qué correos existen). Si es
        una cuenta activa, encola el correo en outbox; el worker de LN-14 emite el
        token de un solo uso (30 min) al enviarlo. El token no se guarda en claro.
        Límites: 5 pedidos por IP cada 15 min y 3 por cuenta cada hora.
      tags: [Panel - Sesión]
      security: [{ csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
            example: { email: admin@totalkids.cl }
      responses:
        "202": { description: Pedido recibido }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/password-reset/confirm:
    post:
      operationId: confirmPanelPasswordReset
      summary: Restablecer la contraseña con el token del enlace
      description: |
        El token es de un solo uso, vence a los 30 minutos y solo vale el último
        enviado. Al usarlo se revocan todas las sesiones de la cuenta (RNF-01).
        Un token inválido, usado o vencido responde 422 con el issue en `token`.
        Límite: 10 intentos por IP cada 15 min.
      tags: [Panel - Sesión]
      security: [{ csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
                password: { type: string, format: password, minLength: 12, maxLength: 128 }
      responses:
        "204": { description: Contraseña cambiada y sesiones revocadas }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ───────────────────────── Formularios públicos (LN-08) ─────────────────────────
  /service-requests:
    post:
      operationId: createServiceRequest
      summary: Solicitud de armado, diseño, personalización, instituciones, regalos o garantía
      description: |
        Público (RF-24). Guarda la solicitud con la aceptación de la política de
        privacidad (fecha y versión) y, en la misma transacción, encola dos correos:
        el acuse al solicitante y el aviso al equipo (`EMAIL_ADMIN_TO`). Devuelve la
        referencia `SOL-<número>`. Límite: 10 envíos por IP cada 15 min.
      tags: [Formularios]
      security: [{ csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateServiceRequest" }
            example:
              service: armado
              name: María González
              email: maria@correo.cl
              phone: "+56 9 1234 5678"
              commune: Temuco
              childrenAges: 3 y 6 años
              preferredDate: "2026-12-20"
              message: Necesito armar una cuna y un ropero en el dormitorio.
              privacyAccepted: true
      responses:
        "201":
          description: Solicitud registrada
          content:
            application/json:
              schema:
                type: object
                required: [reference]
                properties: { reference: { type: string, example: SOL-1002 } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /newsletter:
    post:
      operationId: subscribeNewsletter
      summary: Suscripción con consentimiento explícito
      description: |
        RF-25. `consent` debe ser `true` (la casilla no viene marcada). Guarda la
        fecha y la versión del texto aceptado. Si el correo ya estaba, renueva el
        consentimiento; si se había dado de baja, lo reactiva y los enlaces de baja
        anteriores dejan de servir. Responde 202 siempre (no revela quién está en la
        lista). Límite: 10 por IP cada 15 min.
      tags: [Formularios]
      security: [{ csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, consent, consentVersion]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                consent: { const: true }
                consentVersion:
                  { type: string, maxLength: 40, description: Versión del texto que vio la persona }
            example: { email: maria@correo.cl, consent: true, consentVersion: v1-provisional }
      responses:
        "202": { description: Suscripción recibida }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /newsletter/unsubscribe-link:
    post:
      operationId: requestNewsletterUnsubscribeLink
      summary: Pedir el enlace de baja del newsletter
      description: |
        Paso 1 de la baja (RF-35). Responde 202 exista o no la suscripción. Si el
        correo está suscrito, encola el correo `newsletter_unsubscribe`; el worker
        emite el token de baja al enviarlo (no se guarda en claro). Así nadie puede
        dar de baja a otra persona con solo su correo. Límites: 5 por IP cada 15 min
        y 3 por correo cada hora.
      tags: [Formularios]
      security: [{ csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email, maxLength: 254 } }
      responses:
        "202": { description: Pedido recibido }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /newsletter/unsubscribe:
    post:
      operationId: unsubscribeNewsletter
      summary: Confirmar la baja con el token del enlace
      description: |
        Paso 2 de la baja (RF-35): el enlace `/suscripcion/baja?token=…` del correo.
        La baja no borra pedidos ni el historial; queda registrada con fecha y
        "Suscriptor". Repetir el enlace después de la baja responde 204 igual. Un
        token que no corresponde a ninguna suscripción responde 404.
      tags: [Formularios]
      security: [{ csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
      responses:
        "204": { description: Baja registrada }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ───────────────────────── Tienda: lo que se configura en el panel (LN-16) ─────────────────────────
  /store-theme:
    get:
      operationId: getStoreTheme
      summary: Plantilla visual activa de la tienda
      description: La que activa el Administrador en el panel (UI-13); `clasica` si no hay ninguna guardada. Sin sesión.
      tags: [Tienda]
      security: []
      responses:
        "200":
          description: Plantilla activa
          content:
            application/json:
              schema:
                type: object
                required: [theme]
                properties:
                  theme: { $ref: "#/components/schemas/StoreThemeId" }
              example: { theme: navidad }
  /banners:
    get:
      operationId: listBanners
      summary: Banners de la portada (activos y vigentes)
      description: |
        RF-28. Solo los activos cuya ventana de publicación incluye este momento,
        por orden y título. El destino siempre es una ruta interna de la tienda.
        Sin sesión.
      tags: [Tienda]
      security: []
      responses:
        "200":
          description: Banners vigentes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/PublicBanner" } }

  # ───────────────────────── Panel: catálogo e inventario (LN-12) ─────────────────────────
  # Solo Administrador (RF-26, RF-31: el Operador no modifica ni consulta el catálogo
  # del panel). Cada cambio queda en audit_log con actor, antes/después y requestId.
  /admin/products:
    get:
      operationId: adminListProducts
      summary: Productos del panel (todos los estados)
      description: |
        Búsqueda por nombre o SKU (sin distinguir mayúsculas), filtro por estado y
        por categoría (principal o adicional), paginado. Más recientes primero.
      x-roles: [admin]
      tags: [Panel - Catálogo]
      security: [{ panelSession: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [draft, active, inactive] } }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Página de productos
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    { type: array, items: { $ref: "#/components/schemas/AdminProductSummary" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      operationId: adminCreateProduct
      summary: Crear producto con variantes, categorías y extras
      description: |
        El slug se deriva del nombre y se hace único ("silla", "silla-2"). El SKU se
        guarda en mayúsculas y es único sin distinguir mayúsculas (RF-26). Importes
        enteros ≥ 0 (RN-01); el precio anterior debe ser igual o mayor al precio, y
        si es igual se guarda null (sin oferta). `stockPhysical` de una variante
        nueva queda como movimiento "Stock inicial". Las imágenes se suben después
        (`POST /admin/products/{id}/images`), así que un producto nuevo normalmente
        nace como `draft`.
      x-roles: [admin]
      tags: [Panel - Catálogo]
      security: [{ panelSession: [], csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminProductCreate" }
            example:
              name: Mesa Pikler
              description: Mesa de madera para sala cuna.
              categoryId: 0195f3a0-1b2c-7d3e-8f40-1a2b3c4d5e6f
              optionName: Tamaño
              variants:
                - { sku: TK-MESA-S, optionLabel: Chica, price: 59990, stockPhysical: 2 }
                - { sku: TK-MESA-L, optionLabel: Grande, price: 79990, compareAtPrice: 89990 }
              extras: [{ code: nombre, price: 5000, textMaxLength: 12 }]
      responses:
        "201":
          description: Producto creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProduct" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/products/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: adminGetProduct
      summary: Producto con variantes (activas e inactivas), imágenes, categorías, extras y stock
      x-roles: [admin]
      tags: [Panel - Catálogo]
      security: [{ panelSession: [] }]
      responses:
        "200":
          description: Producto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProduct" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: adminUpdateProduct
      summary: Editar producto, variantes, categorías y extras
      description: |
        Campos parciales. `variants` y `extras`, si vienen, son la lista completa:
        - Variante con `id`: se actualiza. Sin `id`: se crea.
        - Variante que no viene: con unidades reservadas → 409; con historial
          (pedidos, carritos, reservas o movimientos) → se desactiva; sin nada → se borra.
        - El stock físico de una variante existente no se cambia aquí: se usa
          `POST /admin/products/{id}/stock-adjustments` (con motivo, RF-34).
        Publicar (`status: active`) exige categoría principal activa, al menos una
        variante activa, precio en todas las activas y una imagen con texto
        alternativo; la primera vez fija `publishedAt`. El slug no cambia. Editar no
        modifica pedidos anteriores (RN-02).
      x-roles: [admin]
      tags: [Panel - Catálogo]
      security: [{ panelSession: [], csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminProductUpdate" }
      responses:
        "200":
          description: Producto actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProduct" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      operationId: adminDeactivateProduct
      summary: Desactivar producto (no borra el historial)
      description: Pasa a `inactive`. No borra el producto, sus variantes ni sus pedidos (RF-26).
      x-roles: [admin]
      tags: [Panel - Catálogo]
      security: [{ panelSession: [], csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      responses:
        "204": { description: Producto desactivado }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/products/{id}/images:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      operationId: adminUploadProductImage
      summary: Subir una imagen del producto (multipart)
      description: |
        Única operación que acepta `multipart/form-data`. JPG, PNG o WebP
        verificados por sus bytes iniciales (no por la extensión), máximo 2 MB
        (413). El nombre del archivo lo genera el servidor; el ancho y alto se leen
        del encabezado. Sin `sortOrder`, queda al final.
      x-roles: [admin]
      tags: [Panel - Catálogo]
      security: [{ panelSession: [], csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, alt]
              properties:
                file: { type: string, format: binary, description: JPG, PNG o WebP de hasta 2 MB }
                alt: { type: string, maxLength: 160, description: Texto alternativo (obligatorio) }
                sortOrder: { type: integer, minimum: 0 }
                variantId: { type: string, format: uuid, description: Variante de este producto }
      responses:
        "201":
          description: Imagen guardada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminImage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/products/{id}/images/order:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    put:
      operationId: adminReorderProductImages
      summary: Reordenar las imágenes del producto
      description: "`imageIds` debe traer todas las imágenes del producto, una vez cada una."
      x-roles: [admin]
      tags: [Panel - Catálogo]
      security: [{ panelSession: [], csrfCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfTokenHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [imageIds]
              properties:
                imageIds:
                  { type: array, minItems: 1, maxItems: 100, items: { type: string, format: uuid } }
      responses:
        "200":
          description: Imágenes en el nuevo orden
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminImage" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/products/{id}/images/{imageId}:
